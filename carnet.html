<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+HK:wght@500;700&display=swap">
<style>
/* Ticket de cuisine : encre sur os, vermillon pour l'action, jade pour le fait */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --surface-2:#E9E9E2;
  --ink:#1A1C1A; --ink-2:#5C5F5B; --ink-3:#8A8D88; --line:#D8D8D0;
  --accent:#C23B1E; --accent-soft:#F9E9E4;
  --done:#2E6B52; --done-soft:#E3EFE8;
  --font-sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-cjk:'Noto Sans HK','PingFang HK','Microsoft JhengHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171A; --surface:#1E2125; --surface-2:#272A30;
  --ink:#ECECE6; --ink-2:#A6A9A4; --ink-3:#72756E; --line:#32353B;
  --accent:#E8613F; --accent-soft:#39201A;
  --done:#5CB593; --done-soft:#1B2E26;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1E2125; --surface-2:#272A30;
  --ink:#ECECE6; --ink-2:#A6A9A4; --ink-3:#72756E; --line:#32353B;
  --accent:#E8613F; --accent-soft:#39201A;
  --done:#5CB593; --done-soft:#1B2E26;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.head-in{padding-block:12px 0}
.brand{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
select{width:100%;appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--font-sans);font-size:16px;font-weight:500;padding:11px 36px 11px 13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);padding:4px 9px;border-radius:3px}
.pill.cjk{font-family:var(--font-cjk);font-size:13px;letter-spacing:0;text-transform:none;background:var(--accent-soft);color:var(--accent);font-weight:500;padding:3px 9px}
.tabs{display:flex;gap:2px;margin-top:10px}
.tab{flex:1;appearance:none;border:0;background:none;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--ink-3);padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:18px 56px}
.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec-t{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sec-n{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.item{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.dot{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--ink-3);border-radius:50%;display:grid;place-items:center;transition:background .12s,border-color .12s}
.dot svg{width:11px;height:11px;opacity:0;stroke:var(--surface);stroke-width:2.6;fill:none}
.item.on .dot{background:var(--done);border-color:var(--done)}
.item.on .dot svg{opacity:1}
.item-body{flex:1;min-width:0}
.item-n{font-size:14.5px}
.item.on .item-n{color:var(--ink-3);text-decoration:line-through}
.qty{flex:0 0 auto;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px;text-align:right;max-width:38%}
.item.on .qty{color:var(--ink-3)}
.hanzi{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);border-radius:3px;text-decoration:none;font-family:var(--font-cjk);font-size:15px;font-weight:500;line-height:1.3}
.hanzi .ar{font-family:var(--font-sans);font-size:10px;font-weight:600;opacity:.75}
.tip{font-size:12.5px;color:var(--ink-2);margin-top:4px}

.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border-bottom:0}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-mono);font-size:11.5px;font-weight:500;display:grid;place-items:center;margin-top:1px}
.step.on .num{background:var(--done);color:var(--surface)}
.step.on .step-t{color:var(--ink-3);text-decoration:line-through}
.step-t{font-size:14.5px;flex:1;min-width:0}
.flag{display:inline-block;margin-top:5px;font-size:12px;color:var(--accent);font-weight:500}

.note{background:var(--accent-soft);border-radius:6px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.note b{font-weight:600}
.note.kid{background:var(--done-soft)}
.note.pair{background:var(--surface-2)}

.reset{display:block;width:100%;margin-top:20px;padding:11px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);font-family:var(--font-sans);font-size:13px;cursor:pointer}
.reset:hover{border-color:var(--ink-3);color:var(--ink)}
.py{font-family:var(--font-sans);font-style:italic;font-size:.82em;font-weight:400;letter-spacing:0;color:var(--ink-3);margin-left:.4em;white-space:nowrap}
.hanzi .py,.pill.cjk .py{color:currentColor;opacity:.72}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var CHECK='<span class="dot"><svg viewBox="0 0 12 12"><path d="M2 6.3 4.6 9 10 3"/></svg></span>';

/* Chaque entrée : g = groupe d'ingrédients, i = [nom, quantité, {h:hanzi, t:astuce}] */

gongbao:{n:"Gongbao jiding",cjk:"宮保雞丁",c:"Chine",prep:"25 min",cook:"8 min",
 g:[

   ["Cuisse de poulet désossée, en dés de 1,5 cm","500 g",{t:"Surtout pas du blanc, il sèche en dés."}],
   ["Sauce soja claire","1 c. à s."],["Shaoxing","1 c. à s."],["Maïzena","1 c. à s."],["Eau","1 c. à s."]]],
  ["Sauce, mélangée dans un bol",[
   ["Vinaigre de Chinkiang","2 c. à s.",{h:"鎮江香醋",t:"C'est lui qui fait le profil aigre-doux. Pas de substitution."}],
   ["Sucre","2 c. à c."],["Sauce soja claire","1 c. à s."],["Sauce soja épaisse","½ c. à c."],
   ["Maïzena","1 c. à c."],["Bouillon de volaille","4 c. à s."]]],
  ["Aromates et finition",[
   ["Piments rouges séchés, épépinés, en deux","10",{h:"乾辣椒",t:"Les petits rouges courts, pas les longs très forts."}],

   ["Ail en lamelles","3 gousses"],["Gingembre en lamelles","2 cm"],
   ["Blancs de ciboule en tronçons de 1,5 cm","6"],
   ["Cacahuètes grillées non salées","80 g"],["Huile neutre","3 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Mélanger le poulet et la marinade, masser à la main. Laisser 20 minutes.",
    "Mélanger la sauce dans un bol. Couper les piments en deux et secouer les graines dehors.",
    "Tout découper et aligner à côté du wok. La cuisson dure 5 minutes, pas le temps de couper quoi que ce soit.",
    "Huile dans le wok à feu <b>moyen</b>, pas vif. Piments et poivre de Sichuan, 30 secondes, jusqu'à ce que les piments foncent et embaument.",

    "Ail, gingembre et blancs de ciboule, 30 secondes.",
    "Remuer le bol de sauce puis le verser d'un coup. Mélanger 30 secondes, elle épaissit et enrobe tout.",
    "Hors du feu, ajouter les cacahuètes, mélanger et servir immédiatement.|Jamais les cacahuètes avant, elles ramollissent"],
 no:[["Feu moyen pour les piments, maximum pour le poulet.","C'est le seul changement de température et il est critique. Dans une huile trop chaude les piments noircissent en dix secondes et toute la sauce devient amère, sans rattrapage."],
    ["Les piments ne se mangent pas.","Ils parfument l'huile. Le gongbao authentique est un plat aigre-doux légèrement piquant, pas un plat brûlant."],
    ["Pour Chloé","Descendez à 5 piments bien épépinés et sautez le poivre de Sichuan dans le wok. Vous pêchez les piments de son assiette. Le sucré-vinaigré et les cacahuètes marchent très bien à six ans.",1]],
 p:"Servi avec le chou-fleur à l'ail : le chou-fleur en premier, il supporte l'attente. Le gongbao en dernier, il ne se réchauffe pas."},

 g:[

   ["Pousses de bambou en lanières","150 g",{h:"筍絲"}],

   ["Blancs de ciboule en biseau","4"],
   ["Ail haché","4 gousses"],["Gingembre haché","2 cm"]]],
  ["L'assaisonnement yuxiang",[
   ["Piments marinés hachés","4",{h:"泡椒",t:"L'ingrédient d'origine, au rayon des bocaux. À défaut, 1,5 c. à soupe de doubanjiang de Pixian."}]]],
  ["Sauce, mélangée dans un bol",[
   ["Sucre","2 c. à s."],["Vinaigre de Chinkiang","2 c. à s."],
   ["Sauce soja claire","1 c. à s."],["Maïzena","1 c. à c."],["Bouillon de volaille","4 c. à s."]]],
  ["Le reste",[
   ["Huile neutre","4 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Réhydrater les champignons noirs 20 minutes à l'eau tiède. Égoutter, retirer les pieds durs, émincer et bien sécher.",
    "Trancher le porc en lanières de 5 mm. Mélanger avec la marinade, masser à la main, laisser 15 minutes.",
    "Mélanger la sauce dans un bol. Goûter : elle doit être franchement sucrée-vinaigrée, elle s'adoucit au wok.",
    "Tout découper et aligner à côté du wok. La cuisson dure 5 minutes.",
    "Huile à feu très vif. Porc en une couche, 1 minute sans y toucher, puis sauter 1 minute 30 jusqu'à ce qu'il soit doré. Réserver.",

    "Remettre le porc. Remuer le bol de sauce, le verser d'un coup, 30 secondes à gros bouillons jusqu'à ce qu'elle nappe."],
 no:[["Il n'y a pas de poisson dedans.","Yuxiang désigne l'assaisonnement que le Sichuan utilise pour le poisson : piment mariné, gingembre, ail, ciboule, sucre et vinaigre. Rien de marin dans l'assiette."],
    ["Sucre et vinaigre à parts égales.","C'est la colonne vertébrale du profil. Goûtez le bol de sauce avant de le verser, il doit paraître trop marqué, le wok l'adoucit."],
    ["La découpe fait le plat.","肉絲 veut dire lanières. Des morceaux irréguliers cuisent irrégulièrement et le plat perd sa texture. Vingt minutes au congélateur avant de trancher changent tout."],
    ["Pour Chloé","Deux piments marinés au lieu de quatre, ou une cuillère à café de doubanjiang. Le profil sucré-vinaigré passe très bien à six ans, c'est souvent le plat sichuanais préféré des enfants.",1]],
 p:"Il contient déjà ses légumes, inutile de l'accompagner d'un deuxième plat élaboré. Un chou-fleur à l'ail ou un kale sauté suffit."},

   ["Sauce soja claire","2 c. à s."],["Sauce soja épaisse","1 c. à c."],
   ["Maïzena délayée dans 6 c. à s. d'eau froide","3 c. à s."],

  ["Au service",[

 s:["Tremper champignons noirs et shiitake 20 minutes à l'eau tiède. Égoutter, retirer les pieds durs, émincer. Filtrer l'eau des shiitake et la garder.",

    ["Le vinaigre en dernier, hors du feu.","Il s'évapore. Versé pendant le mijotage, la soupe perd son acidité et vous vous retrouvez avec un bouillon plat que vous n'arriverez plus à rattraper."],
    ["La maïzena avant l'œuf.","Un bouillon épaissi tient les rubans en suspension. Dans un bouillon clair, l'œuf tombe au fond et s'agglutine."],
    ["Les rubans d'œuf.","Feu au minimum, filet le plus fin possible, et on remue lentement dans un seul sens. Un remuage énergique casse les rubans en miettes."],
    ["Pour Chloé","Prélevez son bol à la fin de l'étape 8, avant le poivre et le vinaigre. Ajoutez-lui ensuite une demi-cuillère de vinaigre et une pincée de poivre dans son bol. Elle aura la même soupe, dosée pour elle.",1]],
 p:"Se sert en même temps que les plats et le riz, pas en entrée. Avec un sauté de viande, elle fait le repas complet et remplace le légume."},

tofubraise:{n:"Tofu braisé aux shiitake et pak choi",cjk:"紅燒豆腐",c:"Chine",prep:"20 min + 20 min de pressage",cook:"20 min",
 g:[["Ingrédients",[
   ["Tofu ferme, barquette marquée 煎炸","500 g",{h:"煎炸豆腐",t:"La barquette rouge chez Pak Took, celle dont la photo montre des cubes dorés. La verte 蒸煮拌 est tendre et se déliterait. Plus ferme encore : du 板豆腐 à l'étal de tofu du wet market."}],
   ["Champignons shiitake frais émincés","200 g"],
   ["Pak choi coupé en deux","400 g"],
   ["Ail haché","3 gousses"],["Gingembre râpé","2 cm"],
   ["Ciboule ciselée","2 tiges"]]],
  ["Sauce, mélangée dans un bol",[
   ["Sauce d'huître","2 c. à s."],["Sauce soja claire","1 c. à s."],
   ["Sauce soja épaisse","½ c. à c."],["Sucre","1 c. à c."],
   ["Bouillon de légumes","20 cl"],["Maïzena","1 c. à c."]]],
  ["Le reste",[
   ["Huile neutre","4 c. à s."],["Huile de sésame","1 c. à c."],["Riz jasmin","300 g"]]]],
 s:["Presser le tofu avant tout le reste : posez le bloc entre deux feuilles de papier absorbant, une assiette par-dessus, une boîte de conserve sur l'assiette. 15 à 20 minutes. L'épongeage seul ne suffit pas.",
    "Trancher en cubes de 2 cm réguliers.",
    "Huile dans une poêle large à feu moyen-vif. Saisir le tofu en deux fournées, une seule couche, avec de l'espace entre les morceaux.|500 g d'un coup se cuisent à la vapeur les uns des autres",
    "4 minutes par face sans y toucher. Tant qu'un morceau colle, la croûte n'est pas faite. Quand elle l'est, il se décolle tout seul. Réserver sur une assiette.",
    "Si de l'eau apparaît au fond de la poêle, montez le feu et laissez-la s'évaporer avant de poursuivre. Le tofu ne dore pas dans l'eau, il cuit à la vapeur.",
    "Essuyer la poêle, huile neuve. Faire sauter les shiitake 4 minutes. Attendre que le fond redevienne sec et qu'ils commencent à colorer, c'est là que leur goût se concentre.",
    "Ail et gingembre, 30 secondes.",
    "Remuer le bol de sauce et le verser. Remettre le tofu à la spatule, en laissant au fond de l'assiette le liquide qu'il a rendu en attendant.|Ce liquide diluerait la sauce juste avant la liaison",
    "Mijoter 5 minutes à couvert. Pousser la poêle d'avant en arrière plutôt que remuer, le tofu doré est fragile.",
    "Poser le pak choi sur le dessus, couvrir encore 3 minutes, il cuit à la vapeur de la sauce. Hors du feu, huile de sésame et ciboule."],
 no:[["Quel tofu acheter.","Il faut du ferme. Chez Pak Took, c'est la barquette à étiquette rouge marquée 煎炸, celle dont la photo montre des cubes dorés. La verte marquée 蒸煮拌 est tendre et se délitera dans la poêle."],
    ["Presser, puis deux fournées.","Les deux erreurs qui coûtent la croûte dorée. Un tofu non pressé rend son eau dans la poêle. Une poêle surchargée produit le même résultat, les morceaux se cuisent à la vapeur les uns des autres. Dans les deux cas le tofu reste blanc et finit par se défaire."],
    ["Ne cherchez pas à dorer toutes les faces.","Avec du tofu de barquette, retourner chaque cube une deuxième fois casse plus de morceaux que ça n'ajoute de couleur. Deux faces bien colorées suffisent largement."],
    ["Le pak choi à la fin, par-dessus.","Il cuit à la vapeur de la sauce en trois minutes et garde sa couleur. Mélangé plus tôt, il devient kaki et rend de l'eau."],
    ["Pour Chloé","Plat doux, rien à retirer. Le tofu doré est beaucoup plus accessible aux enfants que le tofu nature.",1]],
 p:"Complet avec le riz. Si vous voulez l'accompagner, une soupe claire plutôt qu'un second sauté."},

boeufpdt:{n:"Bœuf braisé aux pommes de terre",cjk:"土豆燒牛肉",c:"Chine",y:"3 pers. + restes",prep:"20 min",cook:"1 h 45",
 g:[["Ingrédients",[
   ["Poitrine de bœuf en cubes de 4 cm","700 g",{h:"牛腩",t:"Le morceau à demander au wet market. Gras et nerfs compris, c'est eux qui fondent en gélatine et donnent la sauce. Un morceau maigre à griller donnera de la viande sèche et filandreuse."}],
   ["Pommes de terre à chair ferme","500 g",{t:"Coupées au couteau roulant, en morceaux irréguliers de 4 cm : les arêtes accrochent la sauce."}],
   ["Carotte en biseau","1 grosse"],
   ["Gingembre en tranches","6 tranches",{t:"Trois partent à l'eau de blanchiment, trois dans le braisage."}],
   ["Ciboule","3 tiges",{t:"Deux entières pour le blanchiment, la troisième ciselée pour la fin."}],
   ["Ail écrasé","4 gousses"]]],
  ["Aromates du braisage",[
   ["Anis étoilé","2",{h:"八角"}],
   ["Casse, bâton de 5 cm","1",{h:"桂皮",t:"Plus épaisse et plus sombre que la cannelle de Ceylan, au rayon des épices en vrac."}],
   ["Feuille de laurier","1"],
   ["Piments séchés entiers","3",{h:"乾辣椒",t:"Facultatif. Entiers, ils parfument sans piquer vraiment, et se retirent avant de servir."}]]],
  ["Sauce",[
   ["Shaoxing","4 c. à s.",{h:"紹興酒",t:"Deux cuillères pour l'eau de blanchiment, deux pour le braisage."}],
   ["Sauce soja claire","3 c. à s."],
   ["Sauce soja épaisse","1 c. à s.",{h:"老抽",t:"Pour la couleur acajou, pas pour le sel."}],
   ["Sucre candi","20 g",{h:"冰糖",t:"Les gros cristaux ambrés. À défaut, 2 c. à c. de sucre en poudre."}],
   ["Eau bouillante","70 cl"],
   ["Sel","au goût"]]],
  ["Le reste",[
   ["Huile neutre","2 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Mettre le bœuf dans une casserole, couvrir d'eau froide, ajouter 3 tranches de gingembre, 2 tiges de ciboule entières et 2 c. à s. de Shaoxing. Monter à ébullition.|L'eau froide au départ fait remonter le sang et les impuretés ; jetée dans l'eau bouillante, la viande se referme et les garde à l'intérieur",
    "Écumer la mousse grise 3 à 4 minutes, jusqu'à ce qu'il n'en remonte plus. Égoutter et rincer à l'eau chaude. Bien sécher les cubes au papier absorbant.",
    "Huile et sucre candi dans une cocotte à feu moyen-doux. Laisser fondre sans remuer jusqu'à la couleur du sirop d'érable, environ 3 minutes.|Une seconde de trop et le caramel vire au brun foncé : il devient amer et il faut tout recommencer. Si vous préférez ne pas tenter, sautez cette étape et ajoutez ½ c. à s. de sauce soja épaisse de plus",
    "Jeter le bœuf dans le caramel et le retourner 2 minutes pour l'enrober. Il doit briller.",
    "Ajouter le gingembre restant, l'ail, l'anis étoilé, la casse, le laurier et les piments. 30 secondes.",
    "Verser le Shaoxing restant sur les bords chauds, puis les deux sauces soja. Couvrir d'eau bouillante à 2 cm au-dessus de la viande.|De l'eau froide sur de la viande chaude la contracte et elle restera dure jusqu'au bout",
    "Couvrir et laisser mijoter 1 h à 1 h 15, à la plus petite ébullition possible, une bulle qui crève de temps en temps.|Un bouillonnement franc délite l'extérieur des cubes bien avant que le centre ne cède",
    "Tester : une baguette doit traverser un cube avec une légère résistance. Si ça résiste encore, continuez par tranches de 15 minutes.",
    "Rincer les pommes de terre coupées sous l'eau froide pour enlever l'amidon de surface, les sécher, puis les ajouter avec la carotte. Goûter le bouillon et saler maintenant.",
    "Poursuivre à découvert 25 à 30 minutes.|Ajoutées au départ, les pommes de terre se défont complètement et leur amidon épaissit la sauce trop tôt, qui attache au fond",
    "Ne jamais remuer à la cuillère : saisir la cocotte par les poignées et la secouer d'avant en arrière. Les pommes de terre sont fragiles et une sauce remuée devient trouble.",
    "La sauce épaissit toute seule avec l'amidon des pommes de terre, aucune maïzena n'est utile. Trop liquide, prolongez 5 minutes à découvert. Trop épaisse ou elle accroche, une louche d'eau bouillante.",
    "Retirer l'anis, la casse, le laurier et les piments. Parsemer de ciboule ciselée."],
 no:[["Le morceau fait tout.","Il faut du 牛腩, de la poitrine, avec son gras et ses nerfs. C'est le collagène qui fond en gélatine et qui donne à la sauce sa tenue brillante. Un morceau maigre vendu pour la poêle n'a rien à fondre : après deux heures il sera sec et filandreux."],
    ["Blanchir, et à l'eau froide.","C'est l'étape que tout le monde saute et c'est elle qui décide de la clarté du bouillon. Départ à froid pour que les impuretés remontent, écumage jusqu'à ce que la mousse grise cesse."],
    ["Les pommes de terre en dernier, 25 minutes.","La seule vraie façon de rater ce plat. Mises au départ, elles finissent en purée et leur amidon épaissit le braisage pendant une heure, le fond de la cocotte attache et prend un goût de brûlé."],
    ["Secouer, ne pas remuer.","Une fois les pommes de terre dedans, la cuillère casse les morceaux et trouble la sauce. On soulève la cocotte et on la secoue."],
    ["Pour Chloé","Le plat est naturellement doux, l'anis étoilé et la casse sont parfumés mais pas piquants. Laissez les piments entiers et retirez-les avant de servir, ou n'en mettez pas du tout. Les pommes de terre fondantes et la viande qui s'effiloche se mangent très bien à la cuillère.",1]],
 p:"Le riz et un légume vert vif pour trancher avec le braisage : le chou-fleur sauté à l'ail ou le kale. Les restes sont meilleurs le lendemain, la sauce ayant fini de pénétrer la viande."},

boulettes:{n:"Boulettes tête de lion braisées au chou chinois",cjk:"紅燒獅子頭",c:"Chine",prep:"30 min",cook:"1 h",
 g:[["Farce",[
   ["Porc haché mi-gras","600 g"],
   ["Châtaignes d'eau fraîches, en dés de 3 mm","6"],
   ["Gingembre râpé","2 c. à c."],
   ["Blancs de ciboule ciselés","3"],
   ["Œuf","1"],["Maïzena","2 c. à s."],
   ["Shaoxing","1 c. à s."],["Sauce soja claire","1 c. à s."],
   ["Sucre","1 c. à c."],["Sel","1 c. à c."],["Poivre blanc","½ c. à c."],
   ["Eau glacée","10 cl"]]],
  ["Braisage",[
   ["Chou chinois en larges morceaux","1 kg"],
   ["Champignons shiitake séchés","6"],
   ["Bouillon de volaille","60 cl"],
   ["Sauce soja épaisse","1 c. à c."],
   ["Huile neutre","3 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Tremper les shiitake 30 minutes à l'eau tiède. Garder l'eau de trempage, filtrée, elle partira dans le braisage.",
    "Hacher les châtaignes d'eau au couteau en dés de 3 mm. Ne pas les mixer.|C'est leur croquant qui allège la boulette ; réduites en purée, elles ne servent plus à rien",
    "Dans un grand bol, le porc avec le gingembre, la ciboule, l'œuf, la maïzena, le Shaoxing, la sauce soja, le sucre, le sel et le poivre blanc. Mélanger avec des baguettes dans un seul sens, 2 minutes.|Changer de sens casse les fibres qui sont en train de s'aligner, et c'est elles qui font tenir la boulette",
    "Verser l'eau glacée en trois fois, en continuant de tourner dans le même sens, jusqu'à absorption complète avant d'en remettre.|C'est cette eau qui rend les boulettes moelleuses ; sans elle elles sont compactes comme un steak haché",
    "Incorporer les châtaignes d'eau. Puis saisir toute la farce à pleine main et la jeter violemment au fond du bol, une quinzaine de fois.|L'étape que personne ne fait et qui décide de tout : une farce non claquée se désagrège au braisage",
    "Former 6 boulettes de la taille d'une balle de tennis, les lisser entre deux paumes mouillées, les réfrigérer 20 minutes.",
    "Tapisser le fond de la cocotte avec les côtes blanches du chou, puis les feuilles par-dessus.|Les boulettes ne doivent jamais toucher le métal : elles accrochent et se cassent au moment de les décoller",
    "Huile dans une poêle à feu moyen. Dorer les boulettes 2 minutes par face sans les bouger, trois à la fois.|Tant que la croûte n'est pas formée elles sont fragiles ; les retourner trop tôt les ouvre en deux",
    "Les poser délicatement sur le chou. Ajouter les shiitake, le bouillon, l'eau de trempage filtrée et la sauce soja épaisse. Le liquide doit monter aux deux tiers des boulettes, pas les recouvrir.",
    "Couvrir et laisser mijoter 50 minutes à la plus petite ébullition possible. Ne jamais remuer.|Un bouillonnement franc les désagrège en une demi-heure",
    "Servir avec le riz, en versant une louche de bouillon et du chou sur chaque bol."],
 no:[["Mi-gras, surtout pas maigre.","Il faut au moins 30 % de gras. Au wet market, demandez 三七肥瘦, sept parts de maigre pour trois de gras. Du porc maigre donne une boulette sèche et caoutchouteuse, et aucune technique ne rattrape ça."],
    ["Tourner dans un seul sens, puis claquer.","Les deux gestes font la même chose, aligner les protéines pour qu'elles forment un réseau. C'est ce réseau qui tient la boulette pendant cinquante minutes de braisage."],
    ["Le chou n'est pas une garniture.","Il fait matelas, il parfume le bouillon et il absorbe la graisse rendue. À la fin il est fondant et c'est souvent ce que les enfants préfèrent."],
    ["Pour Chloé","Rien de piquant, rien à retirer. La boulette est moelleuse, se coupe à la cuillère, et le chou braisé est sucré. Servez-lui une demi-boulette avec beaucoup de chou et de riz.",1]],
 p:"Le riz et rien d'autre, le chou fait le légume. Doublez les quantités sans hésiter : réchauffées le lendemain dans un bouillon clair avec des nouilles et un vert, les boulettes restantes font un dîner complet en quinze minutes."},

choufleur:{n:"Chou-fleur sauté à l'ail",cjk:"蒜蓉花菜",c:"Chine",prep:"5 min",cook:"12 min",
 g:[["Ingrédients",[
   ["Chou-fleur en petits bouquets","600 g",{h:"松花菜",t:"La variété lâche aux longues tiges saute bien mieux que le chou-fleur serré européen."}],
   ["Ail haché","6 gousses"],["Sauce d'huître","1 c. à s."],["Sauce soja claire","1 c. à c."],
   ["Sucre","1 pincée"],["Eau","4 c. à s."],["Huile neutre","2 c. à s."],["Sel, poivre blanc","—"]]]],
 s:["Détacher le chou-fleur en bouquets de la taille d'une bouchée. Bien les sécher.",
    "Wok à feu vif avec l'huile. Jeter le chou-fleur et le laisser sans y toucher 2 minutes pour qu'il colore.",
    "Faire sauter 2 minutes de plus. Des taches brunes doivent apparaître.",
    "Verser l'eau sur les bords du wok, couvrir immédiatement, 3 minutes. La vapeur cuit le cœur.",
    "Découvrir, ajouter l'ail haché, 30 secondes.",
    "Sauce d'huître, sauce soja, sucre, sel et poivre blanc. Sauter 1 minute à découvert jusqu'à évaporation."],
 no:[["Colorer avant de cuire.","Le chou-fleur blanc et bouilli n'a aucun goût. Les deux premières minutes sans y toucher, à feu vif, créent les taches brunes qui font tout le plat."]]},

bpbeef:{n:"Black pepper beef",cjk:"",c:"Chine",prep:"20 min",cook:"12 min",
 g:[["Marinade",[
   ["Filet ou rumsteck en lamelles de 5 mm","500 g",{t:"Dans le sens contraire des fibres."}],
   ["Sauce soja claire","1 c. à s."],["Shaoxing","1 c. à s."],["Maïzena","1 c. à s."],
   ["Huile neutre","1 c. à s."],["Bicarbonate de soude","¼ c. à c.",{t:"Le secret du bœuf tendre des restaurants. Pas plus, sinon goût savonneux."}]]],
  ["Légumes",[
   ["Poivrons rouge et vert en lanières","1 + 1"],["Céleri branche en biseau","3 tiges"],
   ["Ail haché","4 gousses"],["Gingembre râpé","2 cm"]]],
  ["Sauce, mélangée dans un bol",[
   ["Sauce d'huître","2 c. à s."],["Sauce soja claire","1 c. à s."],
   ["Sauce soja épaisse","1 c. à c.",{h:"老抽",t:"Noire et sirupeuse. Sert à la couleur, pas au sel."}],
   ["Sucre","1 c. à c."],["Bouillon","10 cl"],["Maïzena","1 c. à c."]]],
  ["Finition",[
   ["Poivre noir en grains","2 c. à s.",{t:"En grains obligatoirement, le moulu est plat."}],
   ["Beurre","20 g"],["Huile neutre","3 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Mélanger le bœuf et la marinade, masser une minute jusqu'à ce que la viande colle. Laisser 20 minutes.",
    "Concasser le poivre au mortier en gros éclats. Séparer en deux moitiés.",
    "Mélanger la sauce dans un bol.",
    "Huile fumante dans le wok. Saisir le bœuf en deux fois, 1 minute par face sans y toucher. Encore rosé au centre. Réserver.",
    "Huile restante, première moitié du poivre, 20 secondes. Ail et gingembre, 20 secondes.",
    "Céleri 1 minute, puis poivrons 2 minutes. Ils restent croquants.",
    "Remuer le bol de sauce puis le verser. Laisser épaissir 1 minute à gros bouillons.|Servir la part de Chloé maintenant",
    "Remettre le bœuf, 30 secondes. Hors du feu, le beurre et la seconde moitié du poivre."],
 no:[["Le poivre en deux temps.","La première moitié cuit dans l'huile et donne la profondeur, la seconde arrive hors du feu et donne le parfum. Tout mettre au début ne laisse que l'amertume."],
    ["Sans oignon.","L'oignon est normalement la vedette avec les poivrons. Le céleri branche apporte le même croquant et une amertume végétale qui tient tête au poivre."],
    ["Pour Chloé","Servez sa part après l'étape 7, avant la dernière moitié de poivre.",1]],
 p:"Servi avec le chou déchiré au porc : le chou en premier, le bœuf en dernier."},

chouporc:{n:"Chou déchiré au porc",cjk:"手撕包菜",c:"Chine",prep:"10 min",cook:"10 min",
 g:[["Ingrédients",[
   ["Chou de Taiwan","600 g",{h:"高麗菜",t:"Tête peu serrée, feuilles claires et souples. Pas le chou vert dur."}],
   ["Poitrine de porc fraîche en lamelles de 3 cm","100 g",{h:"五花肉",t:"Couches de gras et de maigre bien alternées."}],
   ["Ail en lamelles","5 gousses"],["Piments rouges séchés, coupés en deux","3"],
   ["Sauce soja claire","1,5 c. à s."],["Sauce soja épaisse","½ c. à c."],
   ["Vinaigre de Chinkiang","1,5 c. à s."],["Sucre","1 c. à c."],["Huile neutre","1 c. à s."],["Sel","—"]]]],
 s:["Déchirer le chou à la main en morceaux de la taille d'une paume. Jamais au couteau.",
    "Laver et sécher vraiment bien, à l'essoreuse à salade si possible.",
    "Wok à feu moyen, 1 seule cuillère d'huile. Poitrine 4 minutes sans la bousculer, les bords dorent et se recroquevillent.",
    "S'il y a plus de 2 cuillères de graisse, retirer l'excédent. Garder la viande dans le wok.",
    "Monter à feu maximum. Piments et ail, 15 secondes.",
    "Tout le chou d'un coup, 2 minutes en retournant sans arrêt. Les bords doivent brunir par endroits.",
    "Sauce soja claire, sauce soja épaisse, sucre, une pincée de sel. Encore 1 minute.",
    "Vinaigre versé sur la paroi brûlante, jamais au centre. Mélanger 20 secondes et servir."],
 no:[["Le gras du porc remplace l'huile.","D'où la cuillère unique au départ. Feu moyen pour le porc, feu maximum dès que le chou arrive. Jamais de couvercle, et le sel seulement à l'étape 7."],
    ["Le vinaigre sur la paroi.","Au centre du wok il dilue, sur la paroi il se vaporise et parfume tout. C'est le geste qui sépare un chou correct de celui des petits restaurants."],
    ["Pour Chloé","Piments entiers plutôt que coupés en deux, retirés avant de servir. Ils parfument l'huile sans libérer leur force.",1]]},

mapo:{n:"Mapo tofu",cjk:"麻婆豆腐",c:"Chine",prep:"20 min",cook:"20 min",
 g:[["Base",[
   ["Tofu tendre ou soyeux en cubes de 3 cm","600 g",{t:"Surtout pas du ferme. Le bon mapo a un tofu qui tremble."}],
   ["Bœuf haché","200 g"],
   ["Doubanjiang de Pixian","1,5 c. à s.",{h:"郫縣豆瓣醬",t:"L'âme du plat. Cherchez 郫縣 sur l'étiquette, pas une sauce chili générique."}],
   ["Douchi, rincés et hachés","1 c. à s.",{h:"豆豉",t:"Haricots noirs ridés et secs, pas ceux en conserve dans leur jus."}],
   ["Ail haché","4 gousses"],["Gingembre râpé","2 cm"],
   ["Shaoxing","1 c. à s."],["Sauce soja claire","1 c. à s."],
   ["Bouillon de volaille","15 cl",{t:"Pas 25. Le tofu rend déjà beaucoup d'eau."}],
   ["Maïzena délayée dans 4 c. à s. d'eau froide","2 c. à s."],
   ["Huile neutre","4 c. à s."],["Riz jasmin","300 g"]]],
  ["À la fin",[
   ["Tiges d'ail ou ciboule en tronçons","3",{h:"蒜苗"}],
   ["Poivre de Sichuan en grains","1 c. à c.",{h:"花椒"}],
   ["Huile pimentée","à servir à part"]]]],
 s:["Griller les grains de poivre de Sichuan à sec 2 minutes, les écraser au mortier. Réserver dans un bol, ils ne vont pas dans la poêle.",
    "Eau salée à frémissement, pas à ébullition. Glisser le tofu, 3 minutes. Égoutter et laisser s'égoutter 5 bonnes minutes dans la passoire.",
    "Lancer le riz.",
    "Huile dans le wok à feu vif. Dorer le bœuf 5 minutes en l'écrasant, jusqu'à ce qu'il soit brun et sec.",
    "Baisser à feu moyen. Doubanjiang, 1 minute 30, l'huile doit virer au rouge profond. Puis douchi, ail et gingembre, 30 secondes.",
    "Déglacer au Shaoxing, verser le bouillon et la sauce soja. Porter à frémissement.",
    "Faire glisser le tofu. À partir d'ici ne plus remuer à la spatule, pousser le wok en avant et en arrière.",
    "Mijoter 4 à 5 minutes. Regarder le niveau : s'il a monté, laisser réduire 2 à 3 minutes à découvert.|Ne liez jamais avant que le tofu ait fini de rendre son eau",
    "Verser un tiers de la maïzena, attendre que ça rebouillonne franchement, recommencer deux fois.",
    "Tiges d'ail, une dernière poussée du wok, servir. Chacun moud son poivre de Sichuan et ajoute l'huile pimentée à table."],
 no:[["La maïzena en trois fois, à ébullition franche.","Elle ne prend qu'à gros bouillons. À frémissement elle reste en suspension et la sauce redevient liquide en refroidissant. Refouettez le bol à chaque fois, elle retombe au fond en une minute."],
    ["Pour Chloé","Le doubanjiang est déjà descendu à 1,5 cuillère et le poivre de Sichuan sort de la cuisson. Vous rattrapez dans votre bol avec l'huile pimentée. C'est ainsi qu'on le sert dans beaucoup de restaurants de Chengdu.",1],
    ["Version adultes seuls","Montez à 3 cuillères de doubanjiang et ajoutez 1 cuillère à café de flocons de piment avec l'ail."]]},

dandan:{n:"Dan dan noodles",cjk:"擔擔麵",c:"Chine",prep:"15 min",cook:"25 min",
 g:[["La viande",[
   ["Porc haché","300 g"],
   ["Ya cai, rincé et essoré","80 g",{h:"宜賓芽菜",t:"Petit sachet souple, souvent au rayon sec. C'est lui qui fait la différence."}],
   ["Shaoxing","1 c. à s."],["Sauce soja épaisse","1 c. à c."],["Huile neutre","2 c. à s."]]],
  ["Sauce, par bol (×3)",[
   ["Pâte de sésame chinoise","1 c. à s.",{h:"芝麻醬",t:"Pas du tahini. Plus foncée, graines torréfiées, elle se sépare dans le pot."}],
   ["Sauce soja claire","1 bonne c. à s."],["Vinaigre de Chinkiang","2 c. à c."],
   ["Huile pimentée avec son dépôt","1,5 à 2 c. à s."],["Poivre de Sichuan moulu","1 pincée"],
   ["Sucre","1 pincée"],["Ail râpé","1 gousse"],["Bouillon de volaille chaud","5 cl"]]],
  ["Le reste",[
   ["Nouilles de blé fraîches fines","450 g"],["Ciboule ciselée","4 tiges"],
   ["Cacahuètes grillées non salées, concassées","60 g"],["Choy sum ou bok choy","300 g"]]]],
 s:["Griller les grains de poivre de Sichuan à sec 2 minutes, les écraser au mortier.",
    "Wok à feu vif. Porc haché écrasé à la spatule, 8 à 10 minutes. Il doit perdre toute son eau, brunir et devenir presque croustillant.",
    "Ajouter le ya cai, le Shaoxing et la sauce soja épaisse. Sauter 3 minutes. Réserver au chaud.",
    "Monter la sauce directement dans les trois bols de service. Fouetter à la fourchette pour détendre la pâte de sésame avec le bouillon chaud.",
    "Blanchir le choy sum 2 minutes, le retirer. Cuire les nouilles dans la même eau.",
    "Égoutter les nouilles sans les rincer et les poser sur la sauce. Ajouter porc, choy sum, ciboule, cacahuètes.",
    "Servir en couches et mélanger à table."],
 no:[["La sauce attend au fond du bol.","Elle ne cuit jamais et ne se mélange pas aux nouilles dans une casserole. C'est le convive qui remue. Si monter trois bols vous paraît fastidieux, mélangez tout dans un saladier et répartissez, le résultat est identique."],
    ["La viande doit vraiment sécher.","Les 8 à 10 minutes sont l'étape que tout le monde écourte et c'est celle qui compte."],
    ["Pour Chloé","Montez son bol sans huile pimentée et avec une pincée de poivre de Sichuan seulement. Compensez par une demi-cuillère de pâte de sésame et un filet de bouillon.",1]]},

charsiu:{n:"Char siu maison",cjk:"叉燒",c:"Chine",prep:"15 min + 4 h",cook:"35 min",
 g:[["Ingrédients",[
   ["Échine de porc en bandes","700 g",{t:"Une coupe dans la longueur par morceau, bandes de 4 à 5 cm. Gardez le gras."}],
   ["Sauce hoisin","3 c. à s."],["Sauce soja claire","3 c. à s."],["Miel","3 c. à s."],
   ["Shaoxing","2 c. à s."],["Ail râpé","4 gousses"],["Cinq-épices","1 c. à c."],
   ["Bok choy","500 g"],["Huile neutre","2 c. à s."],["Riz jasmin","300 g"]]]],
 s:["Couper le porc en bandes de 4 à 5 cm, dans la longueur. Entailler en diagonale tous les 2 cm sans trancher jusqu'au bout.",
    "Marinade : hoisin, sauce soja, 2 c. à soupe de miel, Shaoxing, ail râpé, cinq-épices.",
    "Enrober le porc, couvrir, 4 heures au frais, idéalement toute une nuit.",
    "Four à 200°C, 30 minutes, en retournant et badigeonnant toutes les 10 minutes. Sans four : poêle couverte, 25 minutes à feu moyen en retournant souvent.",
    "Badigeonner du miel restant, laisser caraméliser 5 minutes.",
    "Blanchir le bok choy 3 minutes, le sauter 2 minutes avec l'ail et un filet d'huile.",
    "Laisser reposer la viande 5 minutes avant de la trancher finement."],
 no:[["Les entailles en diagonale.","La marinade pénètre bien mieux et le miel accroche dedans."],
    ["Si la marinade brûle avant la fin.","Baissez le feu et couvrez. Le char siu doit être laqué, pas carbonisé."]]},

kale:{n:"Kale sauté à l'ail",cjk:"",c:"Chine",prep:"5 min",cook:"5 min",
 g:[["Ingrédients",[
   ["Kale","500 g",{t:"La côte centrale reste coriace quoi qu'on fasse, détachez les feuilles en tirant le long de la tige."}],
   ["Ail émincé","5 gousses"],["Shaoxing","2 c. à s."],["Sauce d'huître","1 c. à s."],
   ["Sucre","1 pincée"],["Huile neutre","2 c. à s."],["Huile de sésame","un filet"],["Sel","—"]]]],
 s:["Détacher les feuilles de la côte centrale, les déchirer en gros morceaux.",
    "Wok à feu très vif avec l'huile neutre. Ail 20 secondes, pas plus.",
    "Tout le kale d'un coup. Saler et sauter 1 minute.",
    "Verser le Shaoxing sur les bords brûlants, couvrir immédiatement, 1 minute.",
    "Découvrir, sauce d'huître et sucre, 1 minute. Les feuilles doivent être vert vif et fermes.",
    "Hors du feu, un filet d'huile de sésame."],
 no:[["Variante au fu yu.","Écrasez un cube de tofu fermenté rouge avec une cuillère à café de son jus, à la place de la sauce d'huître. C'est le traitement classique des légumes verts à Hong Kong."],
    ["Pour Chloé","Le kale est franchement amer. Blanchir les feuilles 1 minute avant de les sauter enlève une bonne partie de l'amertume, au prix d'un peu de croquant.",1]]},

armoricaine:{n:"Crevettes à l'armoricaine",cjk:"",c:"France",prep:"20 min",cook:"50 min",
 g:[["Crevettes",[
   ["Grosses crevettes entières avec tête","900 g",{t:"Entières, pas décortiquées. Les têtes et carapaces font toute la sauce."}],
   ["Beurre","40 g"],["Huile d'olive","3 c. à s."]]],
  ["La sauce",[
   ["Carotte en petits dés","1"],["Fenouil en petits dés","½ bulbe"],["Ail écrasé","4 gousses"],
   ["Concentré de tomate","2 c. à s."],["Tomates concassées","400 g"],
   ["Cognac ou brandy","5 cl"],["Vin blanc sec","15 cl"],["Eau","30 cl"],
   ["Estragon","1 c. à c. séché"],["Piment de Cayenne","1 pincée"],
   ["Riz jasmin","300 g"],["Sel, poivre","—"]]]],
 s:["Décortiquer les crevettes. Garder têtes et carapaces, réserver la chair au frais.",
    "Huile dans une sauteuse à feu vif. Têtes et carapaces 5 minutes, en les écrasant à la spatule pour faire sortir le jus des têtes. Elles virent au rouge orangé soutenu.",
    "Verser le cognac et flamber, ou laisser évaporer 1 minute.",
    "Carotte, fenouil et ail, 5 minutes. Puis le concentré de tomate, 2 minutes, il doit brunir légèrement.",
    "Vin blanc, réduire de moitié. Ajouter tomates concassées, eau, estragon, Cayenne. Saler.",
    "Mijoter 25 minutes à couvert.",
    "Passer au chinois en pressant fort à la louche. Jeter les carapaces. Réduire à découvert 10 minutes jusqu'à ce que la sauce nappe.",
    "Beurre et huile dans une poêle très chaude. Saisir les crevettes 1 minute 30 par face.",
    "Verser la sauce chaude sur les crevettes, mélanger 30 secondes hors du feu, servir."],
 no:[["Les crevettes finissent dans la sauce, elles n'y cuisent pas.","Trente secondes de trop et elles deviennent caoutchouteuses. La sauce doit être terminée avant que vous ne touchiez à la poêle."],
    ["Sans oignon ni échalote.","La base aromatique est montée sur carotte, fenouil et ail. Le fenouil apporte la douceur que l'oignon donnait, ne le sautez pas."],
    ["L'estragon à Hong Kong.","Difficile à trouver frais au wet market. Le séché fait très bien l'affaire, city'super et Oliver's en ont du frais."]]},

cookies:{n:"Cookies au chocolat",cjk:"",c:"Dessert",y:"18 cookies",prep:"20 min + 24 h de repos",cook:"11 min",
 g:[["Pâte",[
   ["Beurre doux","170 g",{t:"無鹽牛油. Sorti du frigo une heure avant, il doit céder sous le doigt sans être fondu."}],
   ["Cassonade ou sucre roux","150 g"],
   ["Sucre blanc","100 g"],
   ["Œuf entier","1"],
   ["Jaune d'œuf","1",{t:"Le jaune supplémentaire est ce qui donne le cœur moelleux."}],
   ["Extrait de vanille","2 c. à café"],
   ["Farine T55 ou all-purpose","250 g",{t:"À peser, jamais au volume. Hong Kong est humide, la farine se tasse et un verre doseur peut vous en faire mettre un tiers de trop."}],
   ["Bicarbonate de soude","1 c. à café"],
   ["Sel fin","1 c. à café"]]],
  ["Chocolat et finition",[
   ["Chocolat noir 60 à 70 %, haché au couteau","200 g",{t:"Une tablette hachée, pas des pépites. Les morceaux irréguliers font des coulées et la poudre fine marbre la pâte."}],
   ["Fleur de sel","pour le dessus"]]]],
 s:["Travailler le beurre mou avec les deux sucres 3 minutes, jusqu'à ce que le mélange pâlisse et devienne mousseux.",
    "Ajouter l'œuf entier, puis le jaune, puis la vanille, en mélangeant après chaque ajout.",
    "Mélanger à part la farine, le bicarbonate et le sel, puis les verser d'un coup sur le beurre.",
    "Mélanger juste jusqu'à disparition de la farine, pas une seconde de plus.|Une pâte trop travaillée donne des cookies durs",
    "Incorporer le chocolat haché à la spatule.",
    "Couvrir et laisser reposer au réfrigérateur 24 heures, 48 si vous pouvez. Une heure vaut déjà mieux que rien.",
    "Préchauffer le four à 180°C. Couvrir la plaque de papier cuisson.|Posés à même la tôle, les dessous brunissent bien avant que le reste ne cuise",
    "Former des boules d'environ 55 g, la taille d'une balle de golf, six par plaque maximum et bien espacées.",
    "Écraser chaque boule à la paume en un palet de 2,5 cm d'épaisseur, puis laisser la plaque 15 minutes à température ambiante pendant que le four chauffe.|Une boule haute et glacée sortie de 24 h de frigo n'a pas le temps de s'étaler : elle cuit en dôme",
    "Enfourner dans la moitié haute du four, 10 à 12 minutes.",
    "À 7 minutes, regarder. Les palets doivent s'être affaissés et élargis, les bords commencer à prendre. S'ils sont toujours bombés, sortir la plaque et la laisser tomber à plat sur le plan de travail d'une vingtaine de centimètres : les dômes s'affaissent d'un coup. Remettre au four.|C'est le rattrapage, et il marche à tous les coups",
    "Sortir quand les bords sont pris et dorés, le centre encore pâle et visiblement sous-cuit.|Sortez-les quand ils vous semblent crus au milieu",
    "Parsemer de fleur de sel et laisser 10 minutes sur la plaque brûlante sans y toucher. C'est là qu'ils finissent de cuire et que le centre prend."],
 no:[["Le repos au frigo change tout.","Pendant 24 heures la farine s'hydrate complètement et les sucres se dissolvent. Le goût passe de sucré-plat à caramel et toffee, et le cookie s'étale moins à la cuisson. La même pâte cuite immédiatement et cuite le lendemain donnent deux biscuits différents."],
    ["Sortir sous-cuit.","C'est l'erreur numéro un. La plaque brûlante continue la cuisson pendant cinq bonnes minutes. Un cookie déjà doré au centre dans le four sera sec une fois froid."],
    ["S'ils ne s'étalent pas.","Le revers du repos de 24 heures : la pâte sort du frigo dure et froide, et une boule haute met plus de temps à fondre que le four n'en met à la saisir. Elle cuit alors en dôme pâle, avec le dessous qui brunit tout seul. D'où le palet de 2,5 cm et les 15 minutes à température ambiante avant d'enfourner. Et si ça arrive quand même, la plaque lâchée sur le plan de travail à 7 minutes les aplatit."],
    ["Petit four de comptoir.","Dans les petits fours de Hong Kong, la résistance du bas est très près de la plaque. Papier cuisson obligatoire, grille dans la moitié haute, et si les dessous foncent trop vite, une seconde plaque froide glissée sous la première fait écran."],
    ["Pépites ou tablette.","Les pépites contiennent des stabilisants qui les empêchent de fondre, elles restent des points durs. Une tablette hachée au couteau donne des coulées de chocolat et de la poudre qui colore la pâte."],
    ["Pour Chloé","Elle peut rouler les boules, planter quelques morceaux de chocolat sur le dessus avant d'enfourner, et parsemer la fleur de sel à la sortie. La pâte reposée se roule très bien à la main et ne colle pas.",1]],
 p:"La pâte crue se garde 3 jours au réfrigérateur et 3 mois au congélateur en boules déjà formées. Enfournez-les directement congelées, 2 minutes de plus."},

donuts:{n:"Donuts levés",cjk:"",c:"Dessert",y:"12 donuts",prep:"30 min + 2 h de levée",cook:"20 min",
 g:[["Pâte",[
   ["Farine à pain","500 g",{h:"高筋麵粉",t:"La farine à haute teneur en gluten, en sachet dans tous les supermarchés. C'est elle qui donne la mie filante du donut."}],
   ["Lait tiède","24 cl",{t:"Entre 35 et 38°C, tiède au doigt. Au-delà de 50°C il tue la levure."}],
   ["Levure boulangère sèche","7 g"],
   ["Sucre","60 g"],["Œufs","2"],
   ["Beurre mou en morceaux","60 g"],
   ["Sel fin","8 g"],["Extrait de vanille","1 c. à c."]]],
  ["Friture",[
   ["Huile neutre","1,5 à 2 litres",{t:"Arachide ou tournesol. Il faut 6 cm de profondeur dans une casserole haute, pas une poêle."}]]],
  ["Finitions, au choix",[
   ["Sucre glace","250 g",{t:"Pour le glaçage blanc."}],
   ["Lait","4 à 5 c. à s.",{t:"Pour le glaçage, ajouté cuillère par cuillère."}],
   ["Sucre en poudre","150 g",{t:"Pour la version sucre-cannelle."}],
   ["Cannelle moulue","2 c. à c."]]]],
 s:["Délayer la levure et 1 c. à c. de sucre dans le lait tiède. Laisser 10 minutes : une mousse doit se former en surface.|Si rien ne mousse, la levure est morte et rien ne rattrapera la pâte. Recommencez avec un sachet neuf plutôt que de continuer",
    "Mélanger la farine, le reste du sucre et le sel dans un grand bol.",
    "Verser le lait levuré, les œufs et la vanille. Pétrir 5 minutes.",
    "Ajouter le beurre mou morceau par morceau et pétrir encore 8 à 10 minutes, jusqu'à ce que la pâte soit lisse et se décolle des parois tout en restant collante au doigt.|Ne rajoutez pas de farine pour qu'elle colle moins : une pâte enrichie doit rester souple et légèrement collante, c'est exactement ce qui fait le moelleux. Plus de farine donne un donut sec et serré",
    "Mettre en boule dans un bol huilé, couvrir, et laisser lever jusqu'au doublement de volume.|À Hong Kong en novembre comptez 1 h à 1 h 15, mais surveillez : dans un appartement à 28°C ce sera fait en 45 minutes. Fiez-vous au volume, jamais à la montre",
    "Dégazer du plat de la main et abaisser la pâte sur 1,5 cm d'épaisseur.|Plus fine, elle ne gonflera pas assez et le donut sera sec",
    "Découper des disques de 8 cm, puis évider le centre avec un emporte-pièce de 3 cm. Garder les trous, ils se frient aussi.",
    "Poser chaque donut sur son propre carré de papier cuisson.|C'est ce qui permettra de le glisser dans l'huile sans le déformer : un donut levé qu'on soulève à la main s'affaisse et ne reprend jamais sa forme",
    "Couvrir et laisser lever 30 à 45 minutes.",
    "Tester du bout d'un doigt fariné : l'empreinte doit remonter lentement et incomplètement. Si elle remonte aussitôt, attendez encore. Si elle ne remonte pas du tout, c'est trop tard, le donut s'affaissera dans l'huile.",
    "Chauffer l'huile à 175°C, sur 6 cm de profondeur. Sans thermomètre, un cube de pain doit dorer en 45 à 50 secondes.|Le point qui décide de tout : en dessous de 165°C le donut boit l'huile et sort gras, au-dessus de 190°C il est brun dehors et cru dedans",
    "Plonger 3 donuts à la fois, papier compris. Le papier se décolle seul au bout de quelques secondes, retirez-le à la pince.|Plus de trois d'un coup fait chuter la température de l'huile d'une vingtaine de degrés, et tout le reste suit",
    "75 à 90 secondes par face, en ne retournant qu'une seule fois.",
    "Chercher l'anneau pâle tout autour de l'équateur : c'est la signature d'un donut bien levé et bien frit.|Pas d'anneau blanc veut dire soit une pâte trop levée, soit une huile trop chaude",
    "Égoutter sur une grille, jamais sur du papier absorbant.|À plat sur du papier, le dessous cuit dans sa propre vapeur et ramollit en deux minutes",
    "Sucre-cannelle : rouler les donuts encore chauds dans le mélange. Glaçage : mélanger le sucre glace et le lait cuillère par cuillère jusqu'à une texture de crème épaisse, et tremper les donuts tièdes.|Glacé brûlant, le glaçage fond et coule entièrement ; glacé froid, il n'accroche pas"],
 no:[["La température de l'huile est tout le sujet.","Un donut gras n'est pas un donut raté à la cuisson, c'est un donut frit trop froid : il reste trop longtemps dans l'huile et l'absorbe. Un thermomètre de cuisson à 60 HKD règle le problème définitivement. Et l'huile refroidit à chaque fournée, laissez-la remonter entre deux."],
    ["L'anneau blanc.","Regardez n'importe quelle photo de donut de boulangerie : il y a toujours une bande pâle tout autour, là où la pâte flottait hors de l'huile. C'est votre contrôle qualité visuel, et il ne ment pas."],
    ["L'humidité de Hong Kong travaille pour vous.","Les durées de levée des recettes européennes sont systématiquement trop longues ici. En été la pâte peut doubler en 35 minutes. Jugez au volume et à l'empreinte du doigt, pas au minuteur."],
    ["À manger le jour même.","Un donut levé est à son sommet une heure après la friture et déjà décevant le lendemain. C'est la nature du produit, aucune boîte hermétique n'y changera rien. Faites une demi-quantité plutôt que d'en garder."],
    ["Pour Chloé","L'emporte-pièce, c'est elle. Elle peut aussi rouler les donuts chauds dans le sucre-cannelle. Tenez-la à l'écart de la casserole d'huile, en revanche, et faites-lui frire les trous en premier, ils sont prêts en 40 secondes par face et c'est sa récompense pendant que le reste cuit.",1]],
 p:"Les chutes de pâte se refont en boule, se laissent relever 20 minutes et se refrient. Ne les retravaillez qu'une fois, au-delà la pâte devient élastique et les donuts caoutchouteux."},

pouletcaramel:{n:"Poulet au caramel",cjk:"",c:"Vietnam",prep:"20 min",cook:"30 min",
 g:[["Le poulet",[
   ["Hauts de cuisse de poulet avec os","3",{t:"On les désosse soi-même : les os partent au bouillon et c'est lui qui fait la sauce. Garder la peau de côté."}],
   ["Sel fin","¾ c. à c."],
   ["Maïzena","3 c. à s.",{h:"生粉",t:"De la fécule de pomme de terre 馬鈴薯澱粉 donne une coque encore plus croustillante, les deux sont au même rayon."}],
   ["Huile neutre","3 c. à s."],
   ["Beurre","15 g",{t:"Pas orthodoxe pour un plat vietnamien, mais c'est ce que fait la recette d'origine et ça marche."}]]],
  ["Le bouillon d'os",[
   ["Les os des 3 cuisses, concassés","tous"],
   ["Ail","1 gousse"],
   ["Eau","40 cl"]]],
  ["Caramel et sauce",[
   ["Sucre","60 g"],
   ["Eau","2 c. à s."],
   ["Sauce soja claire","2 c. à s."],
   ["Vinaigre de riz ou mirin","1 c. à s."],
   ["Ail haché","2 gousses"],
   ["Ciboule, blancs et verts séparés","3 tiges"],
   ["Citron","½"],
   ["Poivre noir du moulin","au goût"]]],
  ["Pour servir",[
   ["Riz jasmin","300 g"]]]],
 s:["Désosser les hauts de cuisse et retirer la peau. Concasser les os au couteau lourd.|Les os concassés libèrent leur moelle et leur gélatine ; entiers, ils ne donneront qu'une eau tiède en vingt minutes",
    "Os, gousse d'ail et 40 cl d'eau dans une casserole. Porter à ébullition et laisser bouillir à découvert pendant toute la préparation du reste.|Ce bouillon express est le seul vrai travail en avance de la recette, lancez-le en premier",
    "Couper chaque haut de cuisse en quatre morceaux.",
    "Sécher les morceaux au papier absorbant, les saler, puis les rouler dans la maïzena au dernier moment. Tapoter pour enlever l'excédent.|Fariné à l'avance, le poulet transpire et la maïzena se transforme en pâte collante qui ne croustillera jamais",
    "Huile et beurre dans une grande poêle à feu moyen-vif. Déposer les morceaux en une seule couche, sans les toucher pendant 2 minutes.|La coque de fécule met deux minutes à prendre ; si vous remuez avant, elle se détache et reste au fond de la poêle",
    "Les colorer sur toutes les faces, 6 à 8 minutes en tout. Ils doivent être dorés et déjà croustillants.|Et ils le sont sans la peau, c'est tout l'intérêt de la fécule : une peau de poulet met beaucoup plus longtemps à se dessécher et à rendre sa graisse",
    "Ajouter l'ail haché puis les blancs de ciboule. Les laisser rendre leur eau et attendre que le fond de la poêle redevienne sec.|Si vous versez le sucre pendant qu'il reste de l'eau, il se dilue au lieu de caraméliser et vous obtenez un sirop pâle",
    "Verser le sucre et les 2 c. à s. d'eau. Laisser fondre et prendre couleur sans remuer, jusqu'à un ambre soutenu.|Si ça accroche un peu au fond, ce n'est pas grave, le déglaçage récupérera tout. En revanche un caramel qui vire au brun foncé est amer et irrécupérable",
    "Baisser le feu, puis déglacer avec le vinaigre de riz et la sauce soja, en grattant le fond à la spatule.|Versé sur un caramel à pleine chaleur, le liquide projette violemment : reculez le visage et baissez le feu d'abord",
    "Ajouter une louche de bouillon filtré, puis une seconde si nécessaire. La maïzena tombée du poulet lie la sauce toute seule.|Aucune liaison supplémentaire n'est utile, et la sauce épaissit vite : allez-y louche par louche",
    "Laisser réduire 2 à 3 minutes jusqu'à ce que la sauce nappe les morceaux et brille.",
    "Hors du feu, poivrer généreusement, presser le demi-citron et parsemer les verts de ciboule.|L'acidité en fin de cuisson est ce qui empêche le plat de n'être que sucré-salé"],
 no:[["D'où vient cette recette.","C'est le poulet au caramel d'Eloy Spinnler, son \"plat de la flemme\", adapté de 4 à 3 couverts. Le poulet au caramel est vietnamien à l'origine, et la pointe de beurre dans la poêle est un écart que l'auteur assume lui-même."],
    ["La fécule remplace la peau.","L'idée centrale du plat. On retire la peau, qui demanderait un long temps de dessèchement pour croustiller, et on la remplace par une coque de maïzena qui croustille en deux minutes. Bonus : ce qui s'en détache lie la sauce à la fin, sans ajout."],
    ["Sans oignon.","La recette d'origine contient une échalote avec l'ail et les blancs de ciboule. Je l'ai retirée et augmenté l'ail à deux gousses. Le plat ne perd rien, le caramel et le soja portent déjà beaucoup."],
    ["Le bouillon d'os en vingt minutes.","Ça paraît superflu et c'est ce qui fait la différence entre une sauce caramel-soja et une vraie sauce. Vous avez les os sous la main, l'eau bout pendant que vous découpez, ça ne coûte rien."],
    ["Pour Chloé","Pas de piment, un plat sucré-salé que les enfants mangent très bien. Désossé et coupé en quatre, c'est déjà à sa taille. Allez-y doucement sur le poivre dans sa part, et servez le citron à côté plutôt que dessus.",1]],
 p:"Du riz blanc, et si vous voulez faire les choses bien, du riz croustillant : étalez du riz cuit de la veille en couche fine dans une poêle huilée et laissez-le prendre sans y toucher 6 à 8 minutes."},

   ["Sel fin","1 c. à c."],

  ["La croûte",[
   ["Panko","80 g",{h:"日式麵包糠"}],
   ["Persil plat","½ botte"],
   ["Ciboulette","½ botte"],

   ["Citron, le zeste","1"],

  ["Pour servir",[

 s:["Si les filets sont surgelés, les décongeler au réfrigérateur sur une grille pendant une nuit, jamais dans l'eau ni au micro-ondes. S'ils sont frais, passez directement à l'étape suivante.|Une décongélation rapide fait éclater les fibres : le filet rend encore plus d'eau et la chair devient laineuse",
    "Sur un filet frais, repérer la bande brun-rouge qui court le long du flanc et la retirer au couteau, en biais, sur 2 ou 3 mm d'épaisseur.|C'est elle qui porte le goût de vase qu'on reproche au panga. Les filets surgelés du commerce sont presque toujours déjà parés ; les filets frais du wet market, jamais",
    "Poser les filets sur une double épaisseur de papier absorbant, saler les deux faces, couvrir d'une autre double épaisseur et poser une planche légère dessus. 20 minutes au réfrigérateur pour du surgelé, 10 minutes suffisent pour du frais.|L'étape qui décide de tout avec du surgelé, qui est gorgé d'eau souvent ajoutée à la congélation. Sans pressage elle ressort à la cuisson, détrempe la croûte par en dessous et le poisson bout dans son jus. Sur un filet frais le sel sert surtout à raffermir la chair",
    "Changer le papier et sécher une dernière fois. La surface doit être mate, pas brillante.",
    "Préchauffer le four à 210°C, chaleur tournante. Poser une grille sur une plaque, ou à défaut du papier cuisson.|Posé à plat sur la tôle, le dessous du filet baigne dans le peu d'eau qui sort encore",
    "Hacher finement le persil, la ciboulette et l'ail, les mélanger au panko, au parmesan et au zeste de citron.",
    "Verser le beurre fondu et mélanger du bout des doigts jusqu'à obtenir une texture de sable humide.|Trop de beurre et la chapelure s'agglomère en pâte qui ne croustille pas ; pas assez et elle brûle en poudre sèche",
    "Badigeonner le dessus des filets d'une couche fine de moutarde.|C'est elle qui retient la croûte. Sans moutarde, la croûte glisse entièrement du filet au moment de le servir",
    "Presser la croûte sur le dessus seulement, fermement, sur 5 mm d'épaisseur. Rien sur les côtés ni dessous.",
    "Enfourner 12 à 14 minutes selon l'épaisseur, 14 à 16 pour un filet frais, qui est souvent plus épais et moins aqueux.",
    "C'est cuit quand la chair se sépare en gros flocons sous la pointe d'une fourchette mais reste légèrement nacrée au cœur.|Le panga passe de cuit à cotonneux en deux minutes. Sortez-le quand le centre vous semble encore à peine translucide, il finira hors du four",
    "Si la croûte n'est pas assez dorée alors que le poisson est cuit, 60 à 90 secondes sous le gril sans quitter le four des yeux.",
    "Laisser reposer 2 minutes. Servir le citron en quartiers à côté.|Du jus de citron versé sur la croûte la ramollit en quelques secondes. Chacun presse dans son assiette",
    "Pommes de terre grenaille : coupées en deux, huile d'olive, sel, 30 minutes à 210°C. Elles entrent au four avant le poisson."],
 no:[["Frais ou surgelé, ce n'est pas le même poisson.","Surgelé, le panga est gorgé d'eau, souvent ajoutée au conditionnement : vingt minutes de pressage sous un poids, sans discussion, sinon la croûte se détrempe par en dessous. Frais, il en rend bien moins : dix minutes de sel suffisent, et elles servent surtout à raffermir la chair. En revanche un filet frais arrive entier, avec sa bande brune le long du flanc, qu'il faut retirer. Les filets surgelés du commerce sont déjà parés."],
    ["La bande brune, sur un filet frais.","C'est le muscle rouge et le gras qui courent le long du flanc. Ils concentrent le goût de vase qu'on reproche au panga, et ils s'enlèvent en vingt secondes au couteau. C'est la différence entre un poisson neutre et un poisson qui a un arrière-goût."],
    ["La moutarde est une colle.","Une couche fine sur le dessus, et la croûte tient jusqu'à l'assiette. C'est le même principe que la double panure du cordon bleu : il faut quelque chose à quoi la chapelure puisse s'accrocher."],
    ["Si vous voulez monter en gamme.","La méthode est exactement la même avec du cabillaud, du merlu ou du lieu noir, qui ont plus de goût et une chair qui se tient mieux. Comptez simplement 2 minutes de cuisson en moins et un essorage plus court, ces poissons sont bien moins aqueux."],
    ["Pour Chloé","Sans arêtes, goût très doux, et la croûte dorée au parmesan est ce qui emporte l'adhésion. Laissez-la presser la chapelure sur les filets, c'est salissant et facile. Son citron à part.",1]],
 p:"Les pommes de terre grenaille rôties, qui cuisent dans le même four, et une salade verte. Un filet d'huile d'olive crue sur le poisson au moment de servir ne gâche rien."},

 s:["Poser un blanc à plat, la paume bien à plat dessus, et le fendre horizontalement avec un couteau fin sans aller jusqu'au bord opposé. Ouvrir comme un livre.",
    "Glisser l'escalope ouverte dans un sac congélation et l'aplatir à 5 mm au rouleau ou au fond d'une casserole, en frappant du centre vers les bords.|En dessous de 5 mm la viande se déchire, et le fromage sortira par le trou ; au-dessus, le cœur sera cru quand la panure sera dorée",
    "Saler et poivrer l'intérieur, étaler une fine couche de moutarde.",
    "Poser une tranche de jambon, le fromage dessus, puis une seconde tranche de jambon, en laissant 2 cm de poulet nu tout autour.|Le jambon emballe le fromage, c'est lui qui retient la coulée. Du fromage posé au contact du bord trouvera toujours une sortie",
    "Rabattre et souder les bords en pressant fermement du bout des doigts sur tout le pourtour.",
    "Trois assiettes creuses : farine, œufs battus, panko. Passer dans la farine en tapotant l'excédent, puis dans l'œuf, puis dans le panko en pressant bien.",
    "Repasser une seconde fois dans l'œuf puis dans le panko, en insistant sur la tranche.|La double panure est l'assurance anti-fuite ; c'est toujours par le côté que ça lâche",
    "Réfrigérer 30 minutes, à découvert, sur une grille ou une assiette.|L'étape que tout le monde saute et qui décide de tout : la panure sèche, durcit et adhère à la viande. Sans ce repos elle se décolle dans la poêle et le fromage part avec elle",

 no:[["Pourquoi le fromage s'échappe.","Il n'y a jamais qu'une seule raison, il y en a quatre, et elles s'additionnent : une escalope trop fine et percée, du fromage qui touche le bord, une panure simple au lieu de double, et surtout l'absence de repos au froid. Faites les quatre correctement et il ne sort rien."],
    ["Du panko, pas de la chapelure.","C'est le meilleur hasard de cuisiner à Hong Kong : le panko est partout, pour trois fois rien, alors que la chapelure française est un produit d'importation. Et il donne une croûte franchement meilleure, plus aérée et moins grasse."],
    ["À préparer en avance.","Panés et filmés, ils se gardent 24 heures au réfrigérateur, ce qui améliore même la tenue de la panure. Crus et panés, ils se congèlent très bien séparés par du papier cuisson, et se cuisent sans décongélation avec 5 minutes de four en plus."],
    ["Pour Chloé","Un des rares plats qu'un enfant de six ans peut fabriquer presque entièrement. Donnez-lui les trois assiettes de panure, elle trempe et elle retourne, c'est salissant et c'est exactement l'intérêt. Faites le sien plus petit, avec un demi-blanc, il cuira en 3 minutes par face.",1]],

};

var ORDER=[["Chine",["gongbao","yuxiang","suanla","tofubraise","boulettes","boeufpdt","choufleur","bpbeef","chouporc","mapo","dandan","charsiu","kale"]],
           ["Vietnam",["pouletcaramel"]],
           ["France",["armoricaine","bourguignon","panga","cordonbleu"]],
           ["Sucré",["cookies","donuts"]]];

var cur=null;

function esc(s){return s;}

function buildSelect(){
  var sel=document.getElementById('pick'), out='';
  ORDER.forEach(function(grp){
    out+='<optgroup label="'+grp[0]+'">';
    grp[1].forEach(function(id){
      var r=R[id];
      out+='<option value="'+id+'">'+r.n+(r.cjk?'  '+r.cjk:'')+'</option>';
    });
    out+='</optgroup>';
  });
  sel.innerHTML=out;
}

function key(id,kind,i){return 'ck-'+id+'-'+kind+'-'+i;}
function get(k){try{return localStorage.getItem(k)==='1';}catch(e){return false;}}
function set(k,v){try{localStorage.setItem(k,v?'1':'0');}catch(e){}}

function render(id){
  cur=id;
  var r=R[id];

  var m='<span class="pill">'+r.c+'</span><span class="pill">'+(r.y||'3 pers.')+'</span>'+
        '<span class="pill">Prep '+r.prep+'</span><span class="pill">Cuisson '+r.cook+'</span>';
  if(r.cjk) m+='<span class="pill cjk">'+r.cjk+'</span>';
  document.getElementById('meta').innerHTML=pin(m);

  var n=0, gi=0, ing='';
  r.g.forEach(function(grp){
    ing+='<div class="sec"><div class="sec-h"><span class="sec-t">'+grp[0]+'</span><span class="sec-n" data-c="'+gi+'"></span></div>';
    grp[1].forEach(function(it){
      var o=it[2]||{}, k=key(id,'i',n);
      ing+='<div class="item'+(get(k)?' on':'')+'" data-k="'+k+'" data-grp="'+gi+'">'+CHECK+
           '<div class="item-body"><div class="item-n">'+it[0]+'</div>'+
           (o.h?'<a class="hanzi" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(o.h)+'" target="_blank" rel="noopener">'+o.h+' <span class="ar">photo</span></a>':'')+
           (o.t?'<div class="tip">'+o.t+'</div>':'')+
           '</div><span class="qty">'+it[1]+'</span></div>';
      n++;
    });
    ing+='</div>';
    gi++;
  });
  ing+='<button class="reset" id="r-i">Tout décocher</button>';
  document.getElementById('ing').innerHTML=pin(ing);

  var prep='<div class="sec"><div class="sec-h"><span class="sec-t">Préparation</span><span class="sec-n">'+r.s.length+' étapes</span></div>';
  r.s.forEach(function(t,i){
    var parts=t.split('|'), k=key(id,'s',i);
    prep+='<div class="step'+(get(k)?' on':'')+'" data-k="'+k+'"><span class="num">'+(i+1)+'</span><div class="step-t">'+parts[0]+
          (parts[1]?'<span class="flag">'+parts[1]+'</span>':'')+'</div></div>';
  });
  prep+='</div>';
  (r.no||[]).forEach(function(nt){
    prep+='<div class="note'+(nt[2]?' kid':'')+'"><b>'+nt[0]+'</b> '+nt[1]+'</div>';
  });
  if(r.p) prep+='<div class="note pair"><b>Avec quoi le servir.</b> '+r.p+'</div>';
  prep+='<button class="reset" id="r-s">Décocher toutes les étapes</button>';
  document.getElementById('prep').innerHTML=pin(prep);

  wire();
  counts();
  try{localStorage.setItem('carnet-last',id);}catch(e){}
}

function counts(){
  document.querySelectorAll('#ing .sec-n').forEach(function(el){
    var g=el.dataset.c;
    var all=document.querySelectorAll('#ing .item[data-grp="'+g+'"]');
    var on=document.querySelectorAll('#ing .item.on[data-grp="'+g+'"]');
    el.textContent=on.length+' / '+all.length;
  });
}

function wire(){
  document.querySelectorAll('#ing .item').forEach(function(el){
    el.addEventListener('click',function(ev){
      if(ev.target.closest('a'))return;
      el.classList.toggle('on'); set(el.dataset.k, el.classList.contains('on')); counts();
    });
  });
  document.querySelectorAll('#prep .step').forEach(function(el){
    el.addEventListener('click',function(){
      el.classList.toggle('on'); set(el.dataset.k, el.classList.contains('on'));
    });
  });
  var ri=document.getElementById('r-i');
  if(ri) ri.addEventListener('click',function(){
    document.querySelectorAll('#ing .item').forEach(function(el){el.classList.remove('on');set(el.dataset.k,false);});
    counts();
  });
  var rs=document.getElementById('r-s');
  if(rs) rs.addEventListener('click',function(){
    document.querySelectorAll('#prep .step').forEach(function(el){el.classList.remove('on');set(el.dataset.k,false);});
  });
}

function showTab(name){
  document.getElementById('ing').hidden = (name!=='ing');
  document.getElementById('prep').hidden = (name!=='prep');
  document.querySelectorAll('.tab').forEach(function(t){
    t.setAttribute('aria-selected', String(t.dataset.p===name));
  });
  window.scrollTo(0,0);
}

function boot(keep){
  buildSelect();
  var start=null;
  if(keep && R[keep]) start=keep;
  if(!start){ try{var l=localStorage.getItem('carnet-last'); if(l&&R[l]) start=l;}catch(e){} }
  if(!start) start=ORDER[0][1][0];
  document.getElementById('pick').value=start;
  render(start);
  var c=document.getElementById('count');
  if(c) c.textContent=Object.keys(R).length+' recettes';
}

document.getElementById('pick').addEventListener('change',function(e){
  render(e.target.value); showTab('ing');
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){ showTab(t.dataset.p); });
});

boot(null);

/* Les recettes embarquées ci-dessus servent de secours hors ligne.
   Quand le réseau répond, recipes.json fait autorité, ce qui évite
   d'avoir à recréer le raccourci iOS à chaque nouvelle recette. */
fetch('recipes.json?t='+Date.now(),{cache:'no-store'})
  .then(function(res){ return res.ok ? res.json() : null; })
  .then(function(d){
    if(!d || !d.R || !d.ORDER) return;
    if(JSON.stringify(d.R)===JSON.stringify(R) && JSON.stringify(d.ORDER)===JSON.stringify(ORDER)) return;
    var keep=document.getElementById('pick').value;
    R=d.R; ORDER=d.ORDER;
    boot(keep);
  })
  .catch(function(){});
</script>
