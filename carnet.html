}

  color-scheme:dark;
}}

  --bg:#15171A; --surface:#1E2125; --surface-2:#272A30;
  --ink:#ECECE6; --ink-2:#A6A9A4; --ink-3:#72756E; --line:#32353B;
  --accent:#E8613F; --accent-soft:#39201A;
  --done:#5CB593; --done-soft:#1B2E26;

}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 50px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--surface)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.head-in{padding-block:12px 10px}
.brand{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}

  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);padding:4px 9px;border-radius:3px}
.pill.cjk{font-family:var(--font-cjk);font-size:13px;letter-spacing:0;text-transform:none;background:var(--accent-soft);color:var(--accent);font-weight:500;padding:3px 9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.top .brand{margin-bottom:0}
.lang{appearance:none;border:1px solid var(--line);background:var(--bg);font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;color:var(--ink-2);padding:4px 9px;border-radius:999px;cursor:pointer;flex:none}
.lang:hover{color:var(--accent);border-color:var(--accent)}
.addbtn{appearance:none;width:100%;margin-top:9px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:8px;border-radius:4px;cursor:pointer}
.addbtn:hover{color:var(--accent);border-color:var(--accent)}
.addbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.bask{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 11px;font-size:12.5px}
.chip .cnt{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.chip button{appearance:none;border:0;background:var(--line);color:var(--ink-2);width:17px;height:17px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;padding:0}
.chip button:hover{background:var(--accent);color:#fff}
.srcs{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.empty{color:var(--ink-3);font-size:13.5px;line-height:1.6;padding:8px 0 20px}
.acts{display:flex;gap:8px;margin-top:4px}
.acts .reset{flex:1;margin-top:0}
#copyout{width:100%;min-height:160px;margin-top:10px;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink)}
.tabs{display:flex;gap:2px}
.tab{flex:1;appearance:none;border:0;background:none;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--ink-3);padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:18px 56px}
.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec-t{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sec-n{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.item{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.dot{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--ink-3);border-radius:50%;display:grid;place-items:center;transition:background .12s,border-color .12s}
.dot svg{width:11px;height:11px;opacity:0;stroke:var(--surface);stroke-width:2.6;fill:none}
.item.on .dot{background:var(--done);border-color:var(--done)}
.item.on .dot svg{opacity:1}
.item-body{flex:1;min-width:0}
.item-n{font-size:14.5px}
.item.on .item-n{color:var(--ink-3);text-decoration:line-through}
.cart{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink-3);width:31px;height:31px;border-radius:5px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart svg{width:15px;height:15px;display:block}
.cart:hover{color:var(--accent);border-color:var(--accent)}

.item.on .cart{opacity:.45}
.qp{white-space:nowrap}
.qn{border-bottom:1px dashed var(--line);cursor:text;min-width:16px;outline:none;display:inline-block;text-align:right}
.qn:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}
.qn.over{color:var(--accent);border-bottom-style:solid;border-bottom-color:var(--accent)}
.qu{color:var(--ink-2)}
.zh{font-size:15px;margin-top:2px;color:var(--ink)}
.zh .py{margin-left:5px}
.cart.rm{border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;width:28px;height:28px}
.cart.rm:hover{color:var(--accent);background:var(--accent-soft);border-radius:5px}
.qty{flex:0 0 auto;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px;text-align:right;max-width:46%}
.item.on .qty{color:var(--ink-3)}
.hanzi{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);border-radius:3px;text-decoration:none;font-family:var(--font-cjk);font-size:15px;font-weight:500;line-height:1.3}
.hanzi .ar{font-family:var(--font-sans);font-size:10px;font-weight:600;opacity:.75}
.tip{font-size:12.5px;color:var(--ink-2);margin-top:4px}

.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border-bottom:0}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-mono);font-size:11.5px;font-weight:500;display:grid;place-items:center;margin-top:1px}
.step.on .num{background:var(--done);color:var(--surface)}
.step.on .step-t{color:var(--ink-3);text-decoration:line-through}
.step-t{font-size:14.5px;flex:1;min-width:0}
.flag{display:inline-block;margin-top:5px;font-size:12px;color:var(--accent);font-weight:500}

.note{background:var(--accent-soft);border-radius:6px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.note b{font-weight:600}
.note.kid{background:var(--done-soft)}
.note.pair{background:var(--surface-2)}

.reset{display:block;width:100%;margin-top:20px;padding:11px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);font-family:var(--font-sans);font-size:13px;cursor:pointer}
.reset:hover{border-color:var(--ink-3);color:var(--ink)}
.py{font-family:var(--font-sans);font-style:italic;font-size:.82em;font-weight:400;letter-spacing:0;color:var(--ink-3);margin-left:.4em;white-space:nowrap}
.hanzi .py,.pill.cjk .py{color:currentColor;opacity:.72}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Analyse une quantité écrite en français. Rend {n, u} quand la ligne est
   additionnable, null sinon : dans ce cas la liste affichera le texte
   d'origine plutôt que d'inventer un total. */
var QTY_UNITS = [
  [/^(kg|kilos?)\b/, "g", 1000], [/^g\b/, "g", 1],
  [/^(l|litres?)\b/, "ml", 1000], [/^cl\b/, "ml", 10], [/^ml\b/, "ml", 1],
  [/^c\.\s*à\s*s\.?/, "cas", 1], [/^cuill[eè]res?\s+à\s+soupe/, "cas", 1],
  [/^c\.\s*à\s*c\.?/, "cac", 1], [/^c\.\s*à\s*caf[ée]/, "cac", 1],
  [/^cuill[eè]res?\s+à\s+caf[ée]/, "cac", 1],
  [/^gousses?\b/, "gousse", 1], [/^tiges?\b/, "tige", 1],
  [/^tranches?\b/, "tranche", 1], [/^branches?\b/, "branche", 1],
  [/^feuilles?\b/, "feuille", 1], [/^bottes?\b/, "botte", 1],
  [/^bouteilles?\b/, "bouteille", 1], [/^cm\b/, "cm", 1], [/^bulbes?\b/, "bulbe", 1]
];

function qtyParse(s){
  if(!s) return null;
  var t = String(s).trim()
    .replace(/½/g,"+0.5").replace(/¼/g,"+0.25").replace(/¾/g,"+0.75")
    .replace(/(\d)\s*\+/g,"$1+").replace(/^\+/,"");
  /* ", environ 550 g" : c'est le poids qui compte pour les courses */
  var env = t.match(/,\s*environ\s+(.+)$/);
  if(env) t = env[1].replace(/\s+chacun[e]?$/,"").trim();
  /* "1 + 1" : deux poivrons, donc deux */
  var plus = t.match(/^(\d+(?:[.,]\d+)?)\s*\+\s*(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(plus) t = (parseFloat(plus[1].replace(",",".")) + parseFloat(plus[2].replace(",","."))) + " " + plus[3];
  /* une fourchette : on retient la borne haute, on préfère en avoir trop */
  var protect = t.replace(/c\.\s*à\s*[sc]\.?/g,"\u0000").replace(/cuill[eè]res?\s+à\s+\w+/g,"\u0000");
  var rng = protect.match(/^(\d+(?:[.,]\d+)?)\s+(?:à|ou)\s+(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(rng) t = rng[1*1 && 2] + " " + rng[3].replace(/\u0000/g, t.indexOf("c. à c.")>=0 ? "c. à c." : "c. à s.");
  var m = t.match(/^(\d+(?:[.,]\d+)?)(?:\+(\d+(?:\.\d+)?))?\s*(.*)$/);
  if(!m) return null;
  var n = parseFloat(m[1].replace(",", ".")) + (m[2] ? parseFloat(m[2]) : 0);
  if(!isFinite(n)) return null;
  var rest = (m[3] || "").trim().replace(/^(bonne?s?|petites?|grosses?|gros)\s+/,"");
  for(var i=0;i<QTY_UNITS.length;i++){
    if(QTY_UNITS[i][0].test(rest)) return {n: n*QTY_UNITS[i][2], u: QTY_UNITS[i][1]};
  }
  if(rest === "" || /^(gros|grosse|gros+e?s?|entiers?|enti[eè]res?)$/.test(rest)) return {n:n, u:""};
  return null;
}

var QTY_NAMES = {
  cas:["c. à s.","tbsp"], cac:["c. à c.","tsp"],
  gousse:[["gousse","gousses"],["clove","cloves"]],
  tige:[["tige","tiges"],["stalk","stalks"]],
  tranche:[["tranche","tranches"],["slice","slices"]],
  branche:[["branche","branches"],["sprig","sprigs"]],
  feuille:[["feuille","feuilles"],["leaf","leaves"]],
  botte:[["botte","bottes"],["bunch","bunches"]],
  bouteille:[["bouteille","bouteilles"],["bottle","bottles"]],
  cm:["cm","cm"], bulbe:[["bulbe","bulbes"],["bulb","bulbs"]]
};

function qtyNum(n, fr){
  var w = Math.floor(n), f = +(n - w).toFixed(2), s;
  var fr_ = {0.25:"¼",0.5:"½",0.75:"¾"}[f];
  if(fr_) s = (w ? w : "") + fr_;
  else s = String(+n.toFixed(2)).replace(".", fr ? "," : ".");
  return s;
}

/* Rend le nombre et l'unité séparément, pour que la liste de courses puisse
   laisser corriger le nombre sans toucher à l'unité. `facteur` dit par quoi
   multiplier le nombre affiché pour retrouver la valeur de base : 900 g
   s'affiche « 9 cl » quand il s'agit de 90 ml, et taper 12 doit vouloir dire
   12 cl, donc 120 ml. */
function qtySplit(q, lang){
  var fr = lang !== "en", n = q.n, u = q.u;
  if(u === "g"){
    if(n >= 1000) return {num:qtyNum(n/1000, fr), unit:"kg", f:1000};
    return {num:qtyNum(n, fr), unit:"g", f:1};
  }
  if(u === "ml"){
    if(n >= 1000) return {num:qtyNum(n/1000, fr), unit:"l", f:1000};
    if(fr && n >= 100 && n % 10 === 0) return {num:qtyNum(n/10, fr), unit:"cl", f:10};
    return {num:qtyNum(n, fr), unit:"ml", f:1};
  }
  if(u === "") return {num:qtyNum(n, fr), unit:"", f:1};
  var d = QTY_NAMES[u];
  if(!d) return {num:qtyNum(n, fr), unit:"", f:1};
  var label = d[fr ? 0 : 1];
  return {num:qtyNum(n, fr), unit:(typeof label === "string" ? label : label[n > 1 ? 1 : 0]), f:1};
}

function qtyFormat(q, lang){
  var p = qtySplit(q, lang);
  return p.unit ? p.num + " " + p.unit : p.num;
}

/* Lit un nombre tapé à la main : virgule décimale, fractions du carnet. */
function qtyRead(t){
  t = String(t).trim().replace(",", ".");
  var f = {"¼":0.25, "½":0.5, "¾":0.75, "⅓":0.33, "⅔":0.67};
  var g = t.slice(-1), base = f[g];
  if(base != null){
    var tete = t.slice(0, -1).trim();
    if(tete === "") return base;
    var w = parseFloat(tete);
    return isNaN(w) ? null : w + base;
  }
  var v = parseFloat(t);
  return (isNaN(v) || v < 0) ? null : v;
}

/* Fusionne les unités compatibles d'un même ingrédient : les cuillères
   s'additionnent entre elles (1 c. à s. = 3 c. à c.) et un simple nombre se
   range sous l'unité de comptage quand il n'y en a qu'une (6 ciboules +
   1 tige = 7 tiges). Deux unités incompatibles restent séparées : mieux vaut
   deux chiffres côte à côte qu'un faux total. */
var QTY_COUNTED = ["gousse","tige","tranche","branche","feuille","botte","bulbe"];

function qtyMerge(sum){
  if(sum.cas != null && sum.cac != null){
    /* On additionne en cuillères à café, puis on ressort le compte en
       cuillères à soupe entières plus le reste : « 6 c. à s. + 2 c. à c. »
       se lit au marché, « 20 c. à c. » non. */
    var tsp = sum.cas * 3 + sum.cac;
    delete sum.cas; delete sum.cac;
    var tbsp = Math.floor(tsp / 3 + 1e-9), rest = tsp - tbsp * 3;
    if(tbsp > 0) sum.cas = tbsp;
    if(rest > 1e-9) sum.cac = rest;
    if(tbsp === 0 && rest <= 1e-9) sum.cac = tsp;
  }
  if(sum[""] != null){
    var c = QTY_COUNTED.filter(function(u){ return sum[u] != null; });
    if(c.length === 1){ sum[c[0]] += sum[""]; delete sum[""]; }
  }
  return sum;
}

/* Le panier retient des ingrédients, pas des recettes : une entrée vaut
   "recette|groupe|rang". On choisit donc ligne par ligne, en piochant dans
   plusieurs recettes, ce qu'il faut vraiment acheter. */
var BASKET=[];
try{

  if(Array.isArray(_b)) BASKET=_b.filter(function(x){ return typeof x==='string'; });
}catch(e){}
/* Ancien format : une recette entière. On la déplie en ses ingrédients. */
(function(){
  var out=[], changed=false;
  BASKET.forEach(function(x){
    if(x.indexOf('|')>=0){ out.push(x); return; }
    changed=true;
    var r=R_FR[x]; if(!r) return;

/* Quantités corrigées à la main, par ingrédient canonique puis par unité.
   Le total calculé est juste arithmétiquement mais pas toujours au regard de
   ce qu'on achète : on ne cuit le riz qu'une fois pour trois plats. Seul le
   nombre se corrige, jamais l'unité, et on le garde dans l'unité de base,
   donc en millilitres même quand l'écran affiche des centilitres. Un nombre
   n'ayant pas de langue, la correction vaut pour les deux. */
var QTY_OVER=readQty();
function readQty(){
var QTY_OVER={};
try{
  var _q=JSON.parse(localStorage.getItem('carnet-qty')||'{}');
  if(_q && typeof _q==='object'){
    /* On ne garde que la forme attendue : les essais d'un format précédent
       stockaient du texte libre et n'ont plus de sens ici. */
    Object.keys(_q).forEach(function(c){
      var v=_q[c];
      if(v && typeof v==='object' && !Array.isArray(v)){
        var net={};
        Object.keys(v).forEach(function(u){ if(typeof v[u]==='number' && isFinite(v[u])) net[u]=v[u]; });
        if(Object.keys(net).length) QTY_OVER[c]=net;
      }
    });
  }
}catch(e){}
return QTY_OVER;
}
function saveQty(){ try{localStorage.setItem('carnet-qty',JSON.stringify(QTY_OVER));}catch(e){} }
function qtyOver(canon, unite){
  var o=QTY_OVER[canon];
  return (o && o[unite]!=null) ? o[unite] : null;
}
function setQty(canon, unite, valeur){
  var o=QTY_OVER[canon]||{};
  if(valeur==null) delete o[unite]; else o[unite]=valeur;
  if(Object.keys(o).length) QTY_OVER[canon]=o; else delete QTY_OVER[canon];
  saveQty();
}

/* Un ingrédient entre dans la liste s'il a un nom canonique et qu'il
   s'achète : l'eau et les os à bouillon n'ont rien à y faire. */
function shoppable(id,g,i){
  var r=R_FR[id]; if(!r||!r.g[g]||!r.g[g][1][i]) return false;
  var raw=r.g[g][1][i][0];
  return SHOP_SKIP.indexOf(raw)<0 && !!SHOP_ALIAS[raw] && !!SHOP_CANON[SHOP_ALIAS[raw]];
}
function inBasket(id,g,i){ return BASKET.indexOf(id+'|'+g+'|'+i)>=0; }
function toggleItem(id,g,i){
  var k=id+'|'+g+'|'+i, p=BASKET.indexOf(k);
  if(p>=0) BASKET.splice(p,1); else BASKET.push(k);
  saveBasket();
}
/* Les ingrédients de la recette courante qui peuvent entrer dans la liste. */
function shopKeys(id){
  var r=R_FR[id], out=[]; if(!r) return out;
  r.g.forEach(function(grp,g){ grp[1].forEach(function(it,i){
    if(shoppable(id,g,i)) out.push(id+'|'+g+'|'+i);
  });});
  return out;
}

/* Le bouton d'en-tête ne fait qu'un raccourci : tout prendre, ou tout
   enlever. Le choix fin se fait ingrédient par ingrédient. */
function syncAdd(){
  var b=document.getElementById('add'), ks=shopKeys(cur);
  var all = ks.length>0 && ks.every(function(k){ return BASKET.indexOf(k)>=0; });
  b.hidden = ks.length===0;
  b.textContent = all ? U.added : U.add;
  b.classList.toggle('on', all);
}

/* Après une suppression faite depuis l'onglet Courses, les paniers de la
   recette ouverte doivent suivre. */
function syncCarts(){
  document.querySelectorAll('#ing .cart').forEach(function(b){
    var g=b.dataset.b.split('|');
    b.classList.toggle('on', inBasket(cur, +g[0], +g[1]));
  });
  syncAdd();
}

function buildList(){
  var acc={}, order=[];
  BASKET.forEach(function(k){
    var p=k.split('|'), id=p[0], gi=+p[1], ii=+p[2];
    var rf=R_FR[id], rl=R[id];
    if(!rf||!rl||!rf.g[gi]||!rf.g[gi][1][ii]) return;
    var it=rf.g[gi][1][ii], raw=it[0];
    var canon=SHOP_ALIAS[raw]; if(!canon) return;
    var meta=SHOP_CANON[canon]; if(!meta) return;
    if(!acc[canon]){ acc[canon]={canon:canon,en:meta[0],cat:meta[1],sum:{},txt:[],src:[],keys:[]}; order.push(canon); }
    var e=acc[canon];
    e.keys.push(k);
    var q=qtyParse(it[1]);
    if(q){ e.sum[q.u]=(e.sum[q.u]||0)+q.n; }
    else {
      var t=(rl.g[gi]&&rl.g[gi][1][ii]) ? rl.g[gi][1][ii][1] : it[1];
      if(t && e.txt.indexOf(t)<0) e.txt.push(t);
    }
    if(e.src.indexOf(rl.n)<0) e.src.push(rl.n);
  });
  var out=[];
  Object.keys(SHOP_CAT).forEach(function(c){
    var rows=order.filter(function(k){ return acc[k].cat===c; }).map(function(k){
      var e=acc[k], parts=[], sum=qtyMerge(e.sum);
      Object.keys(sum).forEach(function(u){
        var o=qtyOver(e.canon,u);
        parts.push({u:u, auto:sum[u], n:(o!=null?o:sum[u]), over:o!=null});
      });
      e.txt.forEach(function(t){ parts.push({txt:t}); });
      var z=SHOP_ZH[e.canon]||[];
      return {name: LANG==='en' ? e.en : e.canon, canon: e.canon, parts: parts,
              qty: rowQty(parts), src: e.src, keys: e.keys, zh: z[0]||''};
    });
    if(rows.length) out.push({cat:c, label:SHOP_CAT[c][LANG==='en'?1:0], rows:rows});
  });
  return out;
}

/* La quantité en texte brut, pour le presse-papiers. */
function rowQty(parts){
  return parts.map(function(p){
    return p.txt != null ? p.txt : qtyFormat({n:p.n, u:p.u}, LANG);
  }).join(' + ');
}

/* La même, en champs : seul le nombre est modifiable, l'unité reste posée
   à côté et ne bouge jamais. */
function rowQtyHtml(canon, parts){
  return parts.map(function(p){
    if(p.txt != null) return '<span class="qu qp">'+p.txt+'</span>';
    var d=qtySplit({n:p.n, u:p.u}, LANG), a=qtySplit({n:p.auto, u:p.u}, LANG);
    return '<span class="qp"><span class="qn'+(p.over?' over':'')+'" contenteditable="true" spellcheck="false" '+
           'inputmode="decimal" data-c="'+esc(canon)+'" data-u="'+esc(p.u)+'" '+
           'data-f="'+d.f+'" data-auto="'+esc(a.num)+'" title="'+U.qtyT+'">'+d.num+'</span>'+
           (d.unit ? '<span class="qu"> '+d.unit+'</span>' : '')+'</span>';
  }).join('<span class="qu"> + </span>');
}

/* Les recettes d'où viennent les ingrédients retenus, dans l'ordre d'ajout. */
function basketRecipes(){
  var seen={}, out=[];
  BASKET.forEach(function(k){
    var id=k.split('|')[0];
    if(!R[id]) return;
    if(!seen[id]){ seen[id]={id:id, n:R[id].n, c:0}; out.push(seen[id]); }
    seen[id].c++;
  });
  return out;
}

/* Le texte envoyé ne porte que des articles et des quantités : les noms
   de recettes n'aident pas la personne qui fait les courses. Ils restent
   affichés à l'écran, eux. */
function listText(){
  var L=buildList(), lines=[U.listTitle];
  L.forEach(function(sec){
    lines.push(''); lines.push(sec.label.toUpperCase());
    sec.rows.forEach(function(r){
      lines.push('- '+r.name+(r.qty?'  '+r.qty:''));
      if(r.zh) lines.push('  '+r.zh+(PY[r.zh]?' '+PY[r.zh]:''));
    });
  });
  return lines.join('\n');
}

/* Même compteur que l'onglet Ingrédients : coché / total par rayon. */
function cCounts(){
  document.querySelectorAll('#courses .sec-n').forEach(function(el){
    var g=el.dataset.c; if(!g) return;
    var all=document.querySelectorAll('#courses .item[data-grp="'+g+'"]');
    var on=document.querySelectorAll('#courses .item.on[data-grp="'+g+'"]');
    el.textContent=on.length+' / '+all.length;
  });
}

/* Les noms canoniques contiennent des apostrophes (Tête d'ail), qui
   casseraient l'attribut si on les posait tels quels. */
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function renderCourses(){
  var el=document.getElementById('courses');
  if(!BASKET.length){ el.innerHTML='<div class="empty">'+U.emptyC+'</div>'; return; }
  var h='<div class="bask">';
  basketRecipes().forEach(function(r){
    h+='<span class="chip">'+r.n+'<span class="cnt">'+r.c+'</span>'+
       '<button data-rm="'+r.id+'" aria-label="x">\u00d7</button></span>';
  });
  h+='</div>';
  var L=buildList(), total=0;
  L.forEach(function(sec){
    h+='<div class="sec"><div class="sec-h"><span class="sec-t">'+sec.label+'</span><span class="sec-n" data-c="'+sec.cat+'"></span></div>';
    sec.rows.forEach(function(r,i){
      var k=key('shop',sec.cat,i);
      h+='<div class="item'+(get(k)?' on':'')+'" data-k="'+k+'" data-grp="'+sec.cat+'">'+CHECK+
         '<div class="item-body"><div class="item-n">'+r.name+'</div>'+
         (r.zh?'<div class="zh">'+r.zh+'</div>':'')+
         '<div class="srcs">'+r.src.join(', ')+'</div></div>'+
         '<span class="qty">'+rowQtyHtml(r.canon, r.parts)+'</span>'+
         '<button class="cart rm" data-rk="'+r.keys.join(';')+'" title="'+U.rmL+'" aria-label="'+U.rmL+'">\u00d7</button></div>';
      total++;
    });
    h+='</div>';
  });
  h+='<div class="acts"><button class="reset" id="c-copy">'+U.copy+'</button>'+
     '<button class="reset" id="c-clear">'+U.clear+'</button></div>';
  el.innerHTML=pin(h);

  el.querySelectorAll('[data-rm]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.dataset.rm;
      BASKET=BASKET.filter(function(x){ return x.split('|')[0]!==id; });
      saveBasket(); renderCourses(); syncCarts();
    });
  });
  el.querySelectorAll('.item').forEach(function(it){
    it.addEventListener('click',function(ev){
      if(ev.target.closest('.cart'))return;
      var on=!it.classList.contains('on');
      it.classList.toggle('on',on); set(it.dataset.k,on); cCounts();
    });
  });
  el.querySelectorAll('.qn[contenteditable]').forEach(function(q){
    /* Toucher le nombre ne doit pas cocher la ligne. */
    ['click','mousedown','touchstart'].forEach(function(ev){
      q.addEventListener(ev,function(e){ e.stopPropagation(); });
    });
    q.addEventListener('focus',function(){
      var r=document.createRange(); r.selectNodeContents(q);
      var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    q.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); q.blur(); }
      if(e.key==='Escape'){ q.textContent=q.dataset.auto; q.blur(); }
    });
    q.addEventListener('blur',function(){
      var saisi=q.textContent.trim();
      /* Vide, illisible, ou revenu à la valeur calculée : on reprend le calcul. */
      var v = saisi==='' ? null : qtyRead(saisi);
      if(v!=null && saisi!==q.dataset.auto) setQty(q.dataset.c, q.dataset.u, v*parseFloat(q.dataset.f));
      else setQty(q.dataset.c, q.dataset.u, null);
      renderCourses();
    });
  });

  el.querySelectorAll('.cart[data-rk]').forEach(function(b){
    b.addEventListener('click',function(ev){
      ev.stopPropagation();
      var ks=b.dataset.rk.split(';');
      BASKET=BASKET.filter(function(k){ return ks.indexOf(k)<0; });
      saveBasket(); renderCourses(); syncCarts();
    });
  });
  cCounts();
  document.getElementById('c-clear').addEventListener('click',function(){
    BASKET=[]; saveBasket(); renderCourses(); syncCarts();
  });
  document.getElementById('c-copy').addEventListener('click',function(){
    var btn=this, txt=listText();
    function fallback(){
      var ta=document.getElementById('copyout');
      if(!ta){ ta=document.createElement('textarea'); ta.id='copyout'; btn.parentNode.parentNode.appendChild(ta); }
      ta.value=txt; ta.focus(); ta.select();
      btn.textContent=U.manual;
    }
    try{
      navigator.clipboard.writeText(txt).then(function(){
        btn.textContent=U.copied;
        setTimeout(function(){ btn.textContent=U.copy; },1800);
      }, fallback);
    }catch(e){ fallback(); }
  });
}

document.getElementById('add').addEventListener('click',function(){
  var ks=shopKeys(cur);
  var all = ks.length>0 && ks.every(function(k){ return BASKET.indexOf(k)>=0; });
  if(all) BASKET=BASKET.filter(function(k){ return ks.indexOf(k)<0; });
  else ks.forEach(function(k){ if(BASKET.indexOf(k)<0) BASKET.push(k); });
  saveBasket(); syncAdd();
  document.querySelectorAll('#ing .cart').forEach(function(b){
    var g=b.dataset.b.split('|');
    b.classList.toggle('on', inBasket(cur, +g[0], +g[1]));
  });
  if(!document.getElementById('courses').hidden) renderCourses();
});

function showTab(name){
  document.getElementById('ing').hidden = (name!=='ing');
  document.getElementById('prep').hidden = (name!=='prep');
  document.getElementById('courses').hidden = (name!=='courses');
  if(name==='courses') renderCourses();
  document.querySelectorAll('.tab').forEach(function(t){
    t.setAttribute('aria-selected', String(t.dataset.p===name));
  });
  toTop();
}

/* Le carnet affiche le pinyin après toute suite de caractères chinois,
   via la table PY. On y verse les termes de courses qui y manquent, sans
   écraser ceux qui s'y trouvent déjà, avant le premier rendu. */
function mergeShopPinyin(){
  Object.keys(SHOP_ZH).forEach(function(k){
    var z=SHOP_ZH[k];
    if(!PY[z[0]]) PY[z[0]]=z[1];
  });
}

function boot(keep){
  mergeShopPinyin();
  buildSelect();
  var start=null;
  if(keep && R[keep]) start=keep;
  if(!start){ try{var l=localStorage.getItem('carnet-last'); if(l&&R[l]) start=l;}catch(e){} }
  if(!start) start=ORDER[0][1][0];
  document.getElementById('pick').value=start;
  render(start);
  document.getElementById('u-brand').textContent =
    U.brand+' · '+Object.keys(R).length+' '+U.count;
  /* Une recette disparue du carnet ne doit pas laisser de lignes fantômes. */
  BASKET=BASKET.filter(function(k){ return !!R[k.split('|')[0]]; });
  syncAdd();
  if(!document.getElementById('courses').hidden) renderCourses();
}

document.getElementById('pick').addEventListener('change',function(e){
  render(e.target.value); showTab('ing');
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){ showTab(t.dataset.p); });
});

function bootLang(keep){ applyLang(); boot(keep); }

document.getElementById('lang').addEventListener('click',function(){
  var tab = document.getElementById('prep').hidden ? 'ing' : 'prep';
  var keep = document.getElementById('pick').value;
  LANG = LANG==='fr' ? 'en' : 'fr';
  try{localStorage.setItem('carnet-lang',LANG);}catch(e){}
  bootLang(keep);
  showTab(tab);
});

if(CONTENT) bootLang(null); // sans les recettes, sync.js affiche l'écran de clé

/* Synchronisation entre appareils (sync.js) : quand un autre appareil a
   changé le panier, les quantités, les cases cochées ou la langue, sync.js
   l'écrit dans le stockage puis émet un événement « storage » par clé. On
   relit alors ce qui est gardé en mémoire et on redessine en restant sur la
   même recette et le même onglet. Sans cette relecture, le prochain
   enregistrement d'ici écraserait ce qui vient d'arriver. */
var _syncRedraw=0;
window.addEventListener('storage',function(e){
  var k=e.key||'';
  if(k!=='carnet-basket' && k!=='carnet-qty' && k!=='carnet-lang' && k.indexOf('ck-')!==0) return;
  if(k==='carnet-basket'){
    try{ var b=JSON.parse(localStorage.getItem('carnet-basket')||'[]');
      BASKET=Array.isArray(b)?b.filter(function(x){ return typeof x==='string' && x.indexOf('|')>=0; }):[]; }catch(x){ BASKET=[]; }
  }
  if(k==='carnet-qty') QTY_OVER=readQty();
  if(k==='carnet-lang'){ var l=localStorage.getItem('carnet-lang'); if(l==='en'||l==='fr') LANG=l; }
  clearTimeout(_syncRedraw);
  _syncRedraw=setTimeout(function(){
    var tab = !document.getElementById('courses').hidden ? 'courses' : document.getElementById('prep').hidden ? 'ing' : 'prep';
    var y = window.scrollY;
    bootLang(document.getElementById('pick').value);
    showTab(tab);
    try{ window.scrollTo(0, y); if(document.scrollingElement) document.scrollingElement.scrollTop=y; }catch(x){}
  },50);
});

</script>

const APP_SYNC={app:"carnet-recettes",keys:["carnet-basket","carnet-qty","carnet-lang"],prefixes:["ck-"],content:"carnet-content"};
